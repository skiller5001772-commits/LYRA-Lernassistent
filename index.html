<style>
:root{--bg:#02070b;--panel:#07131c;--panel2:#0a1c27;--line:#1c4354;--text:#eaf9ff;--muted:#89a9b9;--cyan:#5fe6ff;--green:#67efb2;--gold:#ffd36a;--red:#ff7187;--shadow:0 14px 40px rgba(0,0,0,.35)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 75% 0,#0c3041 0,transparent 28%),var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:245px;background:rgba(3,10,15,.92);border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:22px;font-weight:800;letter-spacing:1px;padding:8px 10px 22px}.brand span{color:var(--cyan)}nav{display:grid;gap:7px}nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:11px 12px;border-radius:10px}nav button:hover,nav button.active{background:#0c202b;color:var(--text);border-color:#1c4b60}nav button.active{box-shadow:inset 3px 0 0 var(--cyan)}.content{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1300px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--cyan);font-weight:700}.top h1{margin:6px 0;font-size:34px}.desc{color:var(--muted);max-width:700px}.levelbox{min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.level{font-weight:800;color:var(--gold)}.muted,.small{color:var(--muted)}.small{font-size:13px}.bar{height:8px;background:#10222c;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:99px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}.card{background:linear-gradient(145deg,rgba(10,28,39,.94),rgba(5,16,23,.94));border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.wide{grid-column:span 2}.full{grid-column:1/-1}.card h2,.card h3{margin-top:0}.metric{font-size:30px;font-weight:800;margin:7px 0}.pill,.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#0d2c3a;border:1px solid #24566b;color:var(--cyan);font-size:12px;font-weight:700}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{background:#102733;border:1px solid #285568;color:var(--text);padding:9px 13px;border-radius:9px}.btn:hover{filter:brightness(1.15)}.primary{background:#0b5166;border-color:#3aa8c6}.gold{color:#15100a;background:#d6a944;border-color:#f4cf71}.danger{color:#ffb4bf;border-color:#713544}.task{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #15313e}.task:last-child{border-bottom:0}.done .tasktext{text-decoration:line-through;color:#6e8793}.subject{padding:12px 0}.subjectHead{display:flex;justify-content:space-between}.topic{padding:7px 0;color:var(--muted)}input,select,textarea{width:100%;background:#061119;border:1px solid #285568;color:var(--text);border-radius:9px;padding:10px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--cyan)}.row input,.row select{width:auto;min-width:210px}.feedback{margin-top:14px;padding:14px;border:1px solid #224656;background:#07151e;border-radius:10px}.ok{border-color:#28765c}.bad{border-color:#713544}.qopt{display:block;width:100%;margin:9px 0;text-align:left;padding:12px;background:#0a1a23;border:1px solid #245265;border-radius:9px;color:var(--text)}.chat{height:390px;overflow:auto;padding:8px;margin-bottom:10px}.msg{max-width:850px;padding:11px 13px;border-radius:12px;margin:8px 0;line-height:1.45}.msg.lyra{background:#08202a;border:1px solid #1e5264}.msg.me{margin-left:auto;background:#102a1f;border:1px solid #28674f}.timer{text-align:center;font-size:72px;font-weight:800;letter-spacing:2px;margin:25px}.achievement.locked{opacity:.45}details{border:1px solid #173846;border-radius:10px;padding:9px;margin:8px 0}summary{cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;background:#0c2631;border:1px solid var(--cyan);padding:12px 15px;border-radius:10px;display:none;z-index:20}.mobilebar{display:none}
@media(max-width:800px){.side{display:none}.mobilebar{display:flex;position:fixed;top:0;left:0;right:0;height:58px;background:#061119;border-bottom:1px solid var(--line);z-index:10;align-items:center;justify-content:space-between;padding:8px 12px}.content{margin-left:0;width:100%;padding:76px 14px 24px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{display:block}.levelbox{margin-top:14px}.top h1{font-size:29px}.row input,.row select{width:100%}}
</style>

<body>
<div class="mobilebar"><b>LYRA <span style="color:var(--cyan)">4.0</span></b><button class="btn" onclick="toggleMenu()">☰</button></div>
<aside class="side" id="side"><div class="brand">◈ LYRA <span>4.0</span></div><nav>
<button data-p="dashboard" onclick="go('dashboard')">⌂ Dashboard</button>
<button data-p="learn" onclick="go('learn')">◈ Lernen</button>
<button data-p="normal" onclick="go('normal')">◉ Normal</button>

<main class="content" id="main"></main><div class="toast" id="toast"></div>
<script>
'use strict';
const MATERIAL={
Mathematik:['Lineare Funktionen','Quadratische Funktionen','Parabeln','Scheitelpunkt','Nullstellen','Quadratische Gleichungen','Potenzfunktionen','Exponentialfunktionen','Wachstums- und Zerfallsprozesse','Gleichungssysteme','Satz des Pythagoras','Trigonometrie','Sinus, Cosinus, Tangens','Winkelberechnungen','Flächen','Volumen','Körper','Ähnlichkeit','Wahrscheinlichkeiten','Baumdiagramme','Vierfeldertafeln','Mittelwert','Median','Streuung','Diagramme','statistische Auswertungen'],
Deutsch:['Sachtexte','Argumentationen','Zeitungsartikel','literarische Texte','Kurzgeschichten','Romane','Aufbau','Erzählperspektive','Figuren','Sprache','Stilmittel','Wirkung von sprachlichen Mitteln','Textstellen belegen','Erörterung','Argumentation','Analyse','Stellungnahme','Inhaltsangabe','Textvergleich','Grammatik','Rechtschreibung','Zeichensetzung','Satzbau','Wortarten','direkte/indirekte Rede'],
Englisch:['Present / Past / Future','Present Perfect','Past Perfect','Passive','Reported Speech','If-clauses','Relative clauses','Modal verbs','Gerund/infinitive','Comparison','Alltag','Schule','Arbeit/Beruf','Reisen','Umwelt','Gesellschaft','Medien','Zukunft','Großbritannien/Irland','Reading comprehension','Listening','Writing','Mediation','Speaking','Bildbeschreibung','Diskussion','Meinung begründen'],
Physik:['Bewegung','Geschwindigkeit','Beschleunigung','Kraft','Arbeit','Leistung','Energie','Energieerhaltung','Elektrizität','Spannung','Stromstärke','Widerstand','Ohmsches Gesetz','elektrische Leistung','Schaltungen','Magnetismus','elektromagnetische Zusammenhänge','eventuell Atom-/Kernphysik'],
Chemie:['Atombau','Periodensystem','Ionen','chemische Bindungen','chemische Reaktionen','Reaktionsgleichungen','Säuren','Basen','pH-Wert','Neutralisation','Redoxreaktionen','Oxidation','Reduktion','organische Chemie','Kohlenwasserstoffe','Alkohole','Kunststoffe','Umwelt/Chemie im Alltag'],
Gesellschaftslehre:['Demokratie','Bundestag/Bundesregierung','Wahlen','Parteien','Grundgesetz','politische Beteiligung','EU','internationale Politik','Angebot & Nachfrage','Markt','Unternehmen','Arbeitswelt','Globalisierung','Konsum','Inflation','soziale Marktwirtschaft','Nationalsozialismus','Zweiter Weltkrieg','Nachkriegsdeutschland','BRD und DDR','Wiedervereinigung','Europa','aktuelle Entwicklungen','Migration','Bevölkerungsentwicklung','Klima','Ressourcen','nachhaltige Entwicklung'],
Arbeitslehre:['Einkommen','Steuern','Sozialversicherung','Verträge','Konsum','Verbraucherrechte','Wirtschaftskreislauf','Bewerbung','Lebenslauf','Vorstellungsgespräch','Ausbildung','Berufswahl','Arbeitsvertrag','Rechte und Pflichten','technische Systeme','Werkstoffe','Maschinen','Energie','Konstruktion','technische Zeichnungen','Ernährung','Lebensmittel','Haushalt','Kosten','Nachhaltigkeit']};
const ICON={Mathematik:'📐',Deutsch:'🇩🇪',Englisch:'🇬🇧',Physik:'⚡',Chemie:'🧪',Gesellschaftslehre:'🌍',Arbeitslehre:'🔧'};
const PLAN={Montag:'Englisch',Dienstag:'Trading & Online-Business',Mittwoch:'Deutsch',Donnerstag:'Englisch',Freitag:'Chemie',Samstag:'Wiederholung / freie Übung',Sonntag:'Wochenrückblick & Planung'};
const RULES=['Klasse-10-Stoffliste ist die maßgebliche Checkliste.','Reihenfolge innerhalb jedes Fachs grundsätzlich einhalten.','Fortschritt pro Fach separat speichern.','Abgeschlossene Themen markieren und am letzten Stand fortsetzen.','Erst selbst versuchen; Hilfe schrittweise geben, nicht sofort vorsagen.','Sachaufgaben verstehen, Lösungswege erklären und Themen verbinden.','Fehler markieren und gezielt wiederholen.','Klassenarbeiten sind freigeschaltet.','XP und Lernstand lokal speichern.','Wenn ein einzelner Fehler passiert, nicht unnötig alles wiederholen; bei häufigen Fehlern gezielt wiederholen.','Normales Englisch lernt nicht automatisch Vokabeln; Vokabeln gehören in den Vokabelmodus.'];
const LESSON={
'Lineare Funktionen':['Eine lineare Funktion hat die Form y = mx + b. m ist die Steigung, b der y-Achsenabschnitt.','Bei y = 2x + 3: Wie groß ist m?','2'],
'Quadratische Funktionen':['Quadratische Funktionen enthalten x². In y = ax² + bx + c ist a der Faktor vor x².','Welche Zahl steht bei y = 3x² + 2x − 1 vor x²?','3'],
'Nullstellen':['Eine Nullstelle ist ein x-Wert, für den f(x)=0 gilt.','Was muss an einer Nullstelle für f(x) gelten?','0'],
'Satz des Pythagoras':['Im rechtwinkligen Dreieck gilt a²+b²=c². c ist die Hypotenuse.','a=3 cm und b=4 cm. Wie groß ist c?','5'],
'Geschwindigkeit':['Geschwindigkeit beschreibt Strecke pro Zeit. v=s/t.','120 km in 2 Stunden: Wie groß ist v?','60'],
'Ohmsches Gesetz':['Das Ohmsche Gesetz lautet U=R·I. U ist Spannung, R Widerstand und I Stromstärke.','Welche Einheit hat die Spannung U?','volt'],
'pH-Wert':['pH-Werte unter 7 sind sauer, 7 neutral und über 7 basisch.','Ist pH 3 sauer, neutral oder basisch?','sauer'],
'Present / Past / Future':['Present = Gegenwart, Past = Vergangenheit, Future = Zukunft.','Yesterday I ___ (go) to school.','went'],
'Erörterung':['Eine Erörterung baut eine begründete Position auf. Ein gutes Argument besteht aus Behauptung, Begründung und Beispiel/Beleg.','Nenne die drei Bausteine eines guten Arguments.','Behauptung, Begründung, Beispiel/Beleg']};
const QUESTIONS=[['Mathematik','Wie lautet v bei s=120 km und t=2 h?',['60','240','30'],0],['Mathematik','Welche Seite ist die Hypotenuse?',['kürzeste','längste','Kathete'],1],['Deutsch','Ein gutes Argument enthält …',['nur Meinung','Behauptung, Begründung, Beispiel/Beleg','nur Zitat'],1],['Englisch','Yesterday I … to school.',['go','went','gone'],1],['Physik','Einheit der Spannung?',['Ampere','Ohm','Volt'],2],['Chemie','pH 3 ist …',['sauer','neutral','basisch'],0]];
let D=loadData();
function loadData(){try{const x=JSON.parse(localStorage.getItem('LYRA_4')||'null');if(x&&x.done&&typeof x.xp==='number')return x}catch(e){}return {xp:0,done:{},tasks:[],vocab:[],errors:[],quiz:0,tests:[],sessions:0,streak:0,lastStudy:'',lastTopic:{},notes:[],settings:{name:'Danny',aiEndpoint:''},daily:{date:'',minutes:0}}}
function save(){localStorage.setItem('LYRA_4',JSON.stringify(D))}
function topics(){return Object.entries(MATERIAL).flatMap(([s,a])=>a.map(t=>[s,t]))}
function doneCount(){return Object.values(D.done||{}).reduce((n,a)=>n+(a?.length||0),0)}
function next(s){return (MATERIAL[s]||[]).find(t=>!(D.done[s]||[]).includes(t))||'Alle Themen gemeistert'}
function pct(s){return Math.round(((D.done[s]||[]).length/(MATERIAL[s]?.length||1))*100)}
function lvl(){return Math.floor(D.xp/100)+1}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',1800)}
function addXP(n){D.xp+=n;save();toast('+'+n+' XP')}
function touchStudy(){const d=new Date().toISOString().slice(0,10);if(D.lastStudy!==d){D.streak=(D.streak||0)+1;D.lastStudy=d}D.daily={date:d,minutes:D.daily?.minutes||0};save()}
function head(title,desc){document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">LYRA // COMMAND SYSTEM</div><h1>${esc(title)}</h1><div class="desc">${esc(desc)}</div></div><div class="levelbox"><div class="level">LEVEL ${lvl()}</div><div class="muted">${D.xp%100} / 100 XP · 🔥 ${D.streak||0}</div><div class="bar"><div class="fill" style="width:${D.xp%100}%"></div></div></div></div>`}
function go(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));const f={dashboard,learn,normal,vocab,quiz,homework,tests,progress,plan,focus,settings}[p]||dashboard;f();if(innerWidth<801)document.getElementById('side').style.display='none'}
function toggleMenu(){const s=document.getElementById('side');s.style.display=s.style.display==='block'?'none':'block';if(innerWidth<801)s.style.position='fixed'}
function dashboard(){const day=new Intl.DateTimeFormat('de-DE',{weekday:'long'}).format(new Date());const sub=PLAN[day];const nx=MATERIAL[sub]?next(sub):sub;head('Willkommen zurück.','LYRA führt dich anhand deines Lernstands durch deinen Klasse-10-Stoff.');document.getElementById('main').innerHTML+=`<div class="grid"><div class="card wide"><span class="pill">HEUTE · ${day.toUpperCase()}</span><h2>${esc(nx)}</h2><p class="muted">${MATERIAL[sub]?'Nächstes offenes Thema in '+esc(sub)+'.':'Wiederholung / freie Planung.'}</p><button class="btn primary" onclick="go('learn')">Lerneinheit starten →</button></div><div class="card"><h3>Dein Status</h3><div class="metric">${D.xp}</div><div class="muted">XP · Level ${lvl()}</div><div class="metric">${doneCount()}/${topics().length}</div><div class="muted">Themen abgeschlossen</div><div class="metric">${D.errors.length}</div><div class="muted">Wiederholen</div></div><div class="card full"><h3>Schnellstart</h3><div class="row"><button class="btn" onclick="go('learn')">◈ Lernen</button><button class="btn" onclick="go('quiz')">? Quiz</button><button class="btn" onclick="go('vocab')">Aa Vokabeln</button><button class="btn" onclick="go('tests')">▣ Klassenarbeit</button><button class="btn" onclick="go('homework')">✓ Hausaufgaben</button></div></div><div class="card full"><h3>Fächer</h3>${Object.entries(MATERIAL).map(([s,a])=>`<div class="subject"><div class="subjectHead"><b>${ICON[s]} ${esc(s)}</b><b>${pct(s)}%</b></div><div class="bar"><div class="fill" style="width:${pct(s)}%"></div></div><div class="muted">Als Nächstes: ${esc(next(s))}</div></div>`).join('')}</div></div>`}
function learn(){head('Lernen','Erklärung → eigener Versuch → Feedback → Meisterung. LYRA setzt am nächsten offenen Thema des gewählten Fachs fort.');document.getElementById('main').innerHTML+=`<div class="card full"><div class="row"><select id="ls">${Object.keys(MATERIAL).map(s=>`<option>${esc(s)}</option>`).join('')}</select><button class="btn" onclick="loadLesson()">Nächstes Thema</button><button class="btn gold" onclick="repeatError()">Fehler wiederholen</button></div><div id="lesson"></div></div>`;loadLesson()}
function loadLesson(){const s=document.getElementById('ls').value;const t=next(s);const l=LESSON[t]||['Dieses Thema gehört zu deiner Klasse-10-Checkliste. Erkläre zuerst mit eigenen Worten, was du schon weißt. Danach üben wir eine passende Aufgabe.','Erkläre '+t+' mit eigenen Worten.',''];D.lastTopic[s]=t;save();document.getElementById('lesson').innerHTML=`<div style="margin-top:20px"><span class="pill">${ICON[s]} ${esc(s)}</span><h2>${esc(t)}</h2><div class="feedback"><b>LYRA ERKLÄRT</b><br>${esc(l[0])}</div><div class="feedback"><b>DEIN VERSUCH</b><br>${esc(l[1])}</div><div class="row"><input id="la" placeholder="Deine Antwort …"><button class="btn primary" onclick="checkLesson()">Prüfen</button></div><div id="lf"></div><button class="btn" style="margin-top:9px" onclick="hintLesson()">💡 Hinweis</button></div>`}
function hintLesson(){document.getElementById('lf').innerHTML='<div class="feedback">💡 Hinweis: Schreibe zuerst auf, was gegeben ist, was gesucht wird und welche Regel oder Formel du verwenden würdest.</div>'}
function checkLesson(){const a=document.getElementById('la').value.trim().toLowerCase();if(!a)return;touchStudy();const s=document.getElementById('ls').value,t=next(s),l=LESSON[t];const c=(l?.[2]||'').toLowerCase();let ok=c&&a===c;if(t==='Erörterung')ok=a.includes('behaupt')&&a.includes('begründ')&&a.includes('beispiel');if(ok){document.getElementById('lf').innerHTML='<div class="feedback ok">✅ Richtig. Das Grundprinzip sitzt.</div><button class="btn primary" style="margin-top:9px" onclick="master()">Thema meistern +25 XP</button>';D.errors=D.errors.filter(x=>x.topic!==t);save()}else{if(!D.errors.some(x=>x.topic===t))D.errors.push({subject:s,topic:t});save();document.getElementById('lf').innerHTML='<div class="feedback bad">❌ Noch nicht. Versuch es noch einmal. Bei häufigen Fehlern nimmt LYRA das Thema gezielt wieder auf.</div>'}}
function master(){const s=document.getElementById('ls').value,t=next(s);D.done[s]??=[];if(!D.done[s].includes(t)){D.done[s].push(t);D.sessions++;addXP(25);touchStudy()}loadLesson()}
function repeatError(){if(!D.errors.length){toast('Keine offenen Wiederholungen 🎉');return}const e=D.errors[0];document.getElementById('ls').value=e.subject;loadLesson()}
function normal(){head('Normal','Freier Lernassistent. Ohne Backend nutzt LYRA integrierte Hilfen; mit einem sicheren Backend kann echte KI verbunden werden.');document.getElementById('main').innerHTML+=`<div class="card full"><div id="chat" class="chat"><div class="msg lyra"><b>LYRA</b><br>System bereit. Frag mich z. B. „Erkläre Nullstellen“, „Hilf mir bei einer Erörterung“ oder „Prüfe meine Antwort“.</div></div><div class="row"><input id="ci" placeholder="Deine Frage …"><button class="btn primary" onclick="sendChat()">Senden</button></div></div>`;document.getElementById('ci').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()})}
function reply(q){const x=q.toLowerCase();if(x.includes('nullstelle'))return'Eine Nullstelle ist ein x-Wert, für den f(x)=0 gilt. Setze die Funktion gleich 0 und löse nach x. Wenn du willst, machen wir danach eine Aufgabe.';if(x.includes('pythagoras'))return'Im rechtwinkligen Dreieck gilt a²+b²=c². c ist die Hypotenuse.';if(x.includes('erörterung')||x.includes('argument'))return'Ein starkes Argument besteht aus Behauptung, Begründung und Beispiel oder Beleg.';if(x.includes('ohmsche'))return'Das Ohmsche Gesetz lautet U=R·I. U ist die Spannung, R der Widerstand und I die Stromstärke.';return'Ich bin im lokalen Modus. Frag mich nach einem Thema aus deiner Klasse-10-Liste oder verbinde in den Einstellungen dein KI-Backend.'}
async function sendChat(){const input=document.getElementById('ci'),q=input.value.trim();if(!q)return;const chat=document.getElementById('chat');chat.innerHTML+=`<div class="msg me"><b>DU</b><br>${esc(q)}</div>`;input.value='';touchStudy();if(!D.settings.aiEndpoint){chat.innerHTML+=`<div class="msg lyra"><b>LYRA · LOKAL</b><br>${esc(reply(q))}</div>`;addXP(3);chat.scrollTop=chat.scrollHeight;return}const wait=document.createElement('div');wait.className='msg lyra';wait.innerHTML='<b>LYRA · KI</b><br>Analysiere …';chat.appendChild(wait);try{const r=await fetch(D.settings.aiEndpoint.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,context:{name:D.settings.name,xp:D.xp,level:lvl(),streak:D.streak,completed:D.done,errors:D.errors,lastTopic:D.lastTopic,plan:PLAN,class10Material:MATERIAL,rules:RULES},previous_response_id:D.aiPreviousResponseId||null})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Serverfehler');D.aiPreviousResponseId=j.response_id||D.aiPreviousResponseId;wait.innerHTML=`<b>LYRA · KI</b><br>${esc(j.text||'Keine Antwort erhalten.')}`;addXP(5);save()}catch(e){wait.innerHTML=`<b>LYRA · OFFLINE</b><br>KI-Verbindung fehlgeschlagen: ${esc(e.message)}<br><br>Der lokale Lernassistent bleibt verfügbar.`}chat.scrollTop=chat.scrollHeight}
function vocab(){head('Vokabeln','Nur hier werden Vokabeln gezielt gelernt und abgefragt.');document.getElementById('main').innerHTML+=`<div class="grid"><div class="card"><h3>Vokabel hinzufügen</h3><div class="row"><input id="vd" placeholder="Deutsch"><input id="ve" placeholder="Englisch"><button class="btn primary" onclick="addVocab()">Hinzufügen</button></div><div id="vl"></div></div><div class="card"><h3>Vokabeltraining</h3><button class="btn primary" onclick="vStart()">Training starten</button><div id="vq"></div></div></div>`;drawV()}
function addVocab(){const d=document.getElementById('vd').value.trim(),e=document.getElementById('ve').value.trim();if(!d||!e)return;D.vocab.push({d,e,ok:0});save();document.getElementById('vd').value='';document.getElementById('ve').value='';drawV();toast('Vokabel gespeichert')}
function drawV(){document.getElementById('vl').innerHTML=D.vocab.length?D.vocab.map((v,i)=>`<div class="task"><span style="flex:1">${esc(v.d)} → ${esc(v.e)}</span><span class="tag">${v.ok}✓</span><button class="btn danger" onclick="delV(${i})">×</button></div>`).join(''):'<div class="empty muted">Noch keine Vokabeln gespeichert.</div>'}
function delV(i){D.vocab.splice(i,1);save();drawV()}
function vStart(){if(!D.vocab.length){document.getElementById('vq').innerHTML='<div class="feedback bad">Bitte zuerst Vokabeln hinzufügen.</div>';return}const i=Math.floor(Math.random()*D.vocab.length),v=D.vocab[i];document.getElementById('vq').innerHTML=`<div class="feedback"><b>Übersetze:</b><div class="metric">${esc(v.d)}</div><div class="row"><input id="va" placeholder="Englisch …"><button class="btn" onclick="vCheck(${i})">Prüfen</button></div><div id="vf"></div></div>`}
function vCheck(i){const a=document.getElementById('va').value.trim().toLowerCase(),v=D.vocab[i];if(!a)return;if(a===v.e.toLowerCase()){v.ok++;addXP(5);document.getElementById('vf').innerHTML='<div class="feedback ok">✅ Richtig!</div>'}else document.getElementById('vf').innerHTML=`<div class="feedback bad">❌ Noch nicht. Lösung: ${esc(v.e)}</div>`;save();drawV()}
function quiz(){const q=QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];head('Quiz & Training','Gemischte Kurzfragen für schnelles Abrufen.');document.getElementById('main').innerHTML+=`<div class="card full"><span class="pill">${ICON[q[0]]} ${q[0]}</span><h2>${esc(q[1])}</h2>${q[2].map((o,i)=>`<button class="qopt" onclick="qcheck(${i},${q[3]})">${esc(o)}</button>`).join('')}<div id="qf"></div><button class="btn" onclick="quiz()">Nächste Frage</button></div>`}
function qcheck(i,c){const f=document.getElementById('qf');if(i===c){D.quiz++;addXP(10);f.innerHTML='<div class="feedback ok">✅ Richtig · +10 XP</div>'}else f.innerHTML='<div class="feedback bad">❌ Nicht richtig. Schau dir die Frage noch einmal an und versuche die nächste.</div>';save()}
function homework(){head('Hausaufgaben','Deine Aufgabenliste für Schule und Zuhause.');document.getElementById('main').innerHTML+=`<div class="card full"><div class="row"><input id="hi" placeholder="Neue Hausaufgabe …"><button class="btn primary" onclick="hwAdd()">Hinzufügen</button></div><div id="tl"></div></div>`;drawHW()}
function hwAdd(){const x=document.getElementById('hi').value.trim();if(!x)return;D.tasks.push({text:x,done:false});save();document.getElementById('hi').value='';drawHW()}
function drawHW(){document.getElementById('tl').innerHTML=D.tasks.length?D.tasks.map((x,i)=>`<div class="task ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="hwDone(${i},this.checked)" style="width:auto"><span class="tasktext" style="flex:1">${esc(x.text)}</span><button class="btn danger" onclick="hwDel(${i})">Löschen</button></div>`).join(''):'<div class="empty muted">Keine Hausaufgaben.</div>'}
function hwDone(i,v){D.tasks[i].done=v;save();drawHW();if(v)addXP(3)}function hwDel(i){D.tasks.splice(i,1);save();drawHW()}
function tests(){head('Klassenarbeiten','Prüfungstraining ist freigeschaltet. LYRA fragt dich zu einem Stoffgebiet ab und speichert deine Versuche.');document.getElementById('main').innerHTML+=`<div class="grid"><div class="card"><h3>Neue Prüfungssimulation</h3><select id="ts">${Object.keys(MATERIAL).map(s=>`<option>${esc(s)}</option>`).join('')}</select><button class="btn primary" style="margin-top:9px" onclick="startTest()">Simulation starten</button></div><div class="card"><h3>Meine Versuche</h3><div class="muted">${D.tests.length} gestartete Prüfung(en)</div></div><div class="card full"><div id="ta"></div></div></div>`}
function startTest(){const s=document.getElementById('ts').value,arr=MATERIAL[s],t=arr[Math.floor(Math.random()*arr.length)],l=LESSON[t],q=l?l[1]:'Erkläre '+t+' und nenne eine passende Anwendung oder ein Beispiel.';D.tests.push({subject:s,topic:t,date:new Date().toLocaleString('de-DE'),finished:false});save();const idx=D.tests.length-1;document.getElementById('ta').innerHTML=`<div class="feedback"><b>Aufgabe · ${esc(t)}</b><p>${esc(q)}</p><p class="muted">Bewertung: Inhalt + Lösungsweg/Begründung · 10 Punkte</p><textarea id="ans" rows="7" placeholder="Deine Lösung …"></textarea><button class="btn primary" style="margin-top:8px" onclick="finishTest(${idx})">Abgeben</button><div id="tf"></div></div>`}
function finishTest(i){const a=document.getElementById('ans').value.trim();if(!a)return;D.tests[i].finished=true;D.tests[i].answer=a;addXP(30);document.getElementById('tf').innerHTML='<div class="feedback ok">Antwort gespeichert · +30 XP. Eine automatische Bewertung freier Texte gibt es, sobald ein KI-Backend verbunden ist.</div>';save()}
function progress(){head('Fortschritt','Themen, XP, Level, Streak und Wiederholungen auf einen Blick.');const ach=[['Erstes Thema',doneCount()>=1],['10 Themen',doneCount()>=10],['Level 5',lvl()>=5],['50 Vokabeln',D.vocab.length>=50],['Quiz-Profi',D.quiz>=10],['Prüfungsbereit',doneCount()>=Math.ceil(topics().length*.7)]];document.getElementById('main').innerHTML+=`<div class="grid"><div class="card"><div class="metric">${lvl()}</div><div class="muted">Level</div></div><div class="card"><div class="metric">${D.xp}</div><div class="muted">XP</div></div><div class="card"><div class="metric">${D.streak||0}</div><div class="muted">Lerntage-Streak</div></div><div class="card"><div class="metric">${D.errors.length}</div><div class="muted">Wiederholen</div></div><div class="card full"><h3>🏆 Erfolge</h3><div class="grid">${ach.map(a=>`<div class="card achievement ${a[1]?'':'locked'}"><b>${a[1]?'🏅':'🔒'} ${a[0]}</b><div class="muted">${a[1]?'Freigeschaltet':'Noch gesperrt'}</div></div>`).join('')}</div></div><div class="card full"><h3>Fachfortschritt</h3>${Object.entries(MATERIAL).map(([s,a])=>`<div class="subject"><div class="subjectHead"><b>${ICON[s]} ${esc(s)}</b><b>${pct(s)}%</b></div><div class="bar"><div class="fill" style="width:${pct(s)}%"></div></div><div class="muted">${(D.done[s]||[]).length} / ${a.length} Themen · Nächstes: ${esc(next(s))}</div></div>`).join('')}</div><div class="card full"><h3>⚠️ Wiederholungen</h3>${D.errors.length?D.errors.map(e=>`<div class="task"><span style="flex:1">${ICON[e.subject]} ${esc(e.subject)} · ${esc(e.topic)}</span><button class="btn" onclick="learnError('${esc(e.subject)}')">Lernen</button></div>`).join(''):'<div class="empty muted">Keine offenen Wiederholungen 🎉</div>'}</div></div>`}
function learnError(s){go('learn');setTimeout(()=>{const x=document.getElementById('ls');if(x){x.value=s;loadLesson()}},50)}
function plan(){head('Lernplan','Deine Wochenstruktur und die vollständige Klasse-10-Checkliste.');document.getElementById('main').innerHTML+=`<div class="grid"><div class="card wide"><h3>📅 Wochenplan</h3>${Object.entries(PLAN).map(([d,s])=>`<div class="task"><b style="width:110px">${d}</b><span>${esc(s)}</span></div>`).join('')}</div><div class="card"><h3>Heute</h3><p class="muted">Starte eine Lerneinheit oder wiederhole Fehler.</p><button class="btn primary" onclick="go('learn')">Lernen →</button></div><div class="card full"><h3>🎓 Klasse 10 — Stoff-Checkliste</h3>${Object.entries(MATERIAL).map(([s,a])=>`<details><summary><b>${ICON[s]} ${esc(s)}</b> · ${pct(s)}%</summary>${a.map((t,i)=>`<div class="topic">${(D.done[s]||[]).includes(t)?'✅':'⬜'} ${i+1}. ${esc(t)}</div>`).join('')}</details>`).join('')}</div></div>`}
let timer=null,seconds=25*60;
function focus(){head('Fokus','Pomodoro-Fokus. Eine abgeschlossene Session bringt XP.');document.getElementById('main').innerHTML+=`<div class="card full" style="text-align:center"><span class="pill">FOCUS MODE</span><div class="timer" id="clock">25:00</div><div class="row" style="justify-content:center"><select id="mins"><option value="15">15 Minuten</option><option value="25" selected>25 Minuten</option><option value="45">45 Minuten</option><option value="60">60 Minuten</option></select><button class="btn primary" onclick="timerStart()">Start / Pause</button><button class="btn" onclick="timerReset()">Zurücksetzen</button></div></div>`}
function tick(){seconds--;const c=document.getElementById('clock');if(c)c.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0){clearInterval(timer);timer=null;addXP(20);toast('Fokus-Session abgeschlossen · +20 XP')}}
function timerStart(){if(timer){clearInterval(timer);timer=null;return}if(seconds<=0)seconds=Number(document.getElementById('mins').value)*60;timer=setInterval(tick,1000)}
function timerReset(){clearInterval(timer);timer=null;seconds=Number(document.getElementById('mins')?.value||25)*60;const c=document.getElementById('clock');if(c)c.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':00'}
function settings(){head('Einstellungen','Profil, Backup und sichere KI-Verbindung.');document.getElementById('main').innerHTML+=`<div class="grid"><div class="card"><h3>Profil</h3><input id="name" value="${esc(D.settings.name)}" placeholder="Name"><button class="btn primary" style="margin-top:9px" onclick="saveName()">Speichern</button></div><div class="card wide"><h3>🤖 KI-Verbindung</h3><p class="muted">Hier kommt nur die URL deines sicheren LYRA-KI-Backends hinein. Keinen API-Key in die App eintragen.</p><input id="endpoint" value="${esc(D.settings.aiEndpoint||'')}" placeholder="https://dein-backend.example"><div class="row" style="margin-top:9px"><button class="btn primary" onclick="saveEndpoint()">Verbindung speichern</button><button class="btn" onclick="testEndpoint()">Testen</button></div><div id="endpointStatus" class="feedback">Ohne Backend funktioniert LYRA im lokalen Modus.</div></div><div class="card"><h3>Backup</h3><p class="muted">Lernstand sichern und später wiederherstellen.</p><button class="btn" onclick="exportData()">Exportieren</button><label class="btn" style="display:inline-block;margin-top:8px">Importieren<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div><div class="card"><h3>Installation</h3><p class="muted">Auf iPad Safari: Teilen → Zum Home-Bildschirm.</p></div><div class="card full"><h3>LYRA-Regeln</h3>${RULES.map(r=>`<div class="task"><span>✓</span><span>${esc(r)}</span></div>`).join('')}</div><div class="card full"><h3>Gefahrzone</h3><button class="btn danger" onclick="resetData()">Gesamten Lernstand löschen</button></div></div>`}
function saveName(){D.settings.name=document.getElementById('name').value.trim()||'Danny';save();toast('Profil gespeichert')}
function saveEndpoint(){D.settings.aiEndpoint=document.getElementById('endpoint').value.trim().replace(/\/$/,'');D.aiPreviousResponseId='';save();testEndpoint()}
async function testEndpoint(){const e=document.getElementById('endpoint').value.trim().replace(/\/$/,'');const b=document.getElementById('endpointStatus');if(!e){b.textContent='Keine KI-URL eingetragen.';return}b.textContent='Teste Verbindung …';try{const r=await fetch(e+'/health');b.textContent=r.ok?'✓ Verbindung funktioniert.':'Server antwortet nicht korrekt.'}catch{b.textContent='Keine Verbindung. Prüfe die Backend-URL.'}}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='LYRA-Lernstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup erstellt')}
function importData(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.done||typeof x.xp!=='number')throw new Error();D=x;D.settings=D.settings||{name:'Danny',aiEndpoint:''};save();go('dashboard');toast('Lernstand importiert')}catch{toast('Import nicht erkannt')}};r.readAsText(f)}
function resetData(){if(confirm('Wirklich den gesamten LYRA-Lernstand löschen?')){localStorage.removeItem('LYRA_4');location.reload()}}
go('dashboard');
</script>
</body></html>
