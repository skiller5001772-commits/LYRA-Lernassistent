r(--muted);padding:15px}.hidden{display:none!important}.worksheet{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;background:#06141d}.workhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.worktask{border:1px solid #173b48;border-radius:12px;padding:14px;margin-top:10px;background:#071821}.solution{display:none;border-left:3px solid var(--gold);padding:10px;margin-top:9px;background:#17140b;border-radius:8px}.solution.show{display:block}.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

"pH-Wert":["pH-Werte unter 7 sind sauer, 7 ist neutral und Werte über 7 sind basisch.","Ist pH 3 sauer, neutral oder basisch?","sauer"],
"Present / Past / Future":["Present = Gegenwart, Past = Vergangenheit, Future = Zukunft. Unregelmäßige Verben muss man lernen.","Yesterday I ___ (go) to school.","went"],
"Erörterung":["Eine Erörterung baut eine begründete Position auf. Gute Argumente bestehen aus Behauptung, Begründung und Beispiel/Beleg.","Nenne drei Bausteine eines guten Arguments.","Behauptung, Begründung, Beispiel/Beleg"]};
let old=JSON.parse(localStorage.getItem("LYRA_3")||"null");
if(!old){let legacy=JSON.parse(localStorage.getItem("LYRA_2")||"null");old=legacy||{};}
let D=Object.assign({xp:0,done:{},tasks:[],vocab:[],errors:[],quiz:0,tests:[],sessions:0,lastTopic:{},settings:{name:"Danny",theme:"system",backend:"",geminiKey:"",classTestsEnabled:false,mode:"ipad",studyDays:["Montag","Mittwoch","Freitag"],dailyMinutes:60,autoExamWeeks:2,customRules:[]},exams:[],notes:[],topicStudy:{},chat:[]},old);

async function callBackend(payload){
  const key=D.settings.geminiKey||"";
  if(!key) throw new Error("Gemini API-Key fehlt. Trage ihn in Einstellungen → KI-Verbindung ein.");
  const url="https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent";

3. Erst bei sicherer Beherrschung auf schwierigem Klasse-10-Niveau abschließen.
4. Bei Fehlern konkret helfen; ein einzelner Fehler bedeutet keine komplette Wiederholung.
5. Häufige Fehler gezielt wiederholen.
6. Vokabeln gehören in den Vokabelmodus.
7. Die festgelegte Stoffreihenfolge nicht eigenmächtig verändern.
8. Bei Fotos Aufgaben/Lösungen genau lesen und Fehler Schritt für Schritt erklären.
9. Wenn der Lösungsweg fehlt, zuerst einen Hinweis geben und nicht sofort alles vorsagen.

${payload.context||""}

Schüler:
${payload.message||""}` }];

    const m=String(payload.image).match(/^data:([^;]+);base64,(.*)$/);

  }

  const r=await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":key},
    body:JSON.stringify({contents:[{role:"user",parts}]})

  if(!answer)throw new Error("Gemini hat keine Antwort zurückgegeben.");
  return answer;
}

function parseVocabJSON(text){let t=String(text||'').trim();t=t.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();let a;try{a=JSON.parse(t)}catch(e){let m=t.match(/\[[\s\S]*\]/);if(!m)throw new Error('Die KI hat keine gültige Vokabelliste geliefert.');a=JSON.parse(m[0])}if(!Array.isArray(a))throw new Error('Die KI hat keine Vokabelliste geliefert.');return a.map(x=>({d:String(x.d||x.de||x.german||'').trim(),e:String(x.e||x.en||x.english||'').trim()})).filter(x=>x.d&&x.e)}
async function vocabPhoto(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{vpr.innerHTML='<div class="feedback">📷 Foto geladen. '+(D.settings.geminiKey?'KI erkennt die Vokabeln …':'Für automatische Erkennung bitte zuerst den Gemini-Key speichern.')+'</div>';if(D.settings.geminiKey){try{let out=await callBackend({message:'Du bist im Vokabelmodus. Lies dieses Foto sorgfältig. Erkenne ALLE sichtbaren Vokabelpaare (Deutsch ↔ Englisch). Ignoriere Überschriften, Beispielsätze und sonstigen Text. Antworte ausschließlich mit einem JSON-Array, ohne Markdown, ohne Erklärung, Format: [{"d":"deutsches Wort","e":"englisches Wort"}]. Wenn mehrere Spalten vorhanden sind, ordne jedes passende Paar korrekt zu.',image:r.result,context:buildContext()});let words=parseVocabJSON(out);if(!words.length)throw new Error('Keine Vokabelpaare erkannt.');let added=0;for(const v of words){let exists=D.vocab.some(x=>normalize(x.d)===normalize(v.d)&&normalize(x.e)===normalize(v.e));if(!exists){D.vocab.push({d:v.d,e:v.e,ok:0});added++}}save();vpr.innerHTML='<div class="feedback ok">✅ '+added+' Vokabeln automatisch gespeichert. '+(words.length-added?words.length-added+' waren schon vorhanden. ':'')+'Jetzt kannst du direkt <b>„Lernen“</b> drücken.</div>';drawV();let metric=document.querySelector('#main .card:nth-child(2) .metric');if(metric)metric.textContent=D.vocab.length}catch(e){vpr.innerHTML='<div class="feedback bad">KI-Fotoanalyse: '+esc(e?.message||'nicht erreichbar')+'</div>'}}};r.readAsDataURL(f)}
function vStart(){if(!D.vocab.length){vq.innerHTML='<div class="feedback bad">Bitte zuerst Vokabeln hinzufügen oder per KI erkennen lassen.</div>';return}let i=Math.floor(Math.random()*D.vocab.length),v=D.vocab[i];vq.innerHTML='<div class="feedback" style="margin-top:12px"><b>Übersetze:</b><div class="metric">'+esc(v.d)+'</div><div class="row"><input id="va" placeholder="Englisch …"><button class="btn" onclick="vCheck('+i+')">Prüfen</button></div><div id="vf"></div></div>'}
function vCheck(i){let v=D.vocab[i],a=normalize(va.value);if(a===normalize(v.e)){v.ok++;vf.innerHTML='<div class="feedback ok">✅ Richtig · +10 XP</div>';addXP(10)}else vf.innerHTML='<div class="feedback bad">❌ Noch nicht. Versuch es noch einmal.</div>';save()}
const Q=[["Mathematik","Wie lautet v bei s=120 km und t=2 h?",["60","240","30"],0],["Mathematik","Welche Seite ist die Hypotenuse?",["kürzeste","längste","Kathete"],1],["Deutsch","Ein gutes Argument enthält …",["nur Meinung","Behauptung, Begründung, Beispiel/Beleg","nur Zitat"],1],["Englisch","Yesterday I … to school.",["go","went","gone"],1],["Physik","Einheit der Spannung?",["Ampere","Ohm","Volt"],2],["Chemie","pH 3 ist …",["sauer","neutral","basisch"],0]];
function quiz(){let q=Q[Math.floor(Math.random()*Q.length)];head('Quiz & Training','Gemischte Kurzfragen. Richtige Antworten bringen XP und verbessern deine Trainingsstatistik.');main.innerHTML+='<div class="card full" style="margin-top:24px"><span class="pill">'+q[0]+'</span><h2>'+q[1]+'</h2>'+q[2].map((o,i)=>'<button class="qopt" onclick="qcheck('+i+','+q[3]+')">'+esc(o)+'</button>').join('')+'<div id="qf"></div><button class="btn" style="margin-top:10px" onclick="quiz()">Nächste Frage</button></div>'}
function qcheck(i,c){if(i===c){qf.innerHTML='<div class="feedback ok">✅ Richtig · +15 XP</div>';D.quiz++;addXP(15)}else qf.innerHTML='<div class="feedback bad">❌ Nicht ganz. Merke dir den Zusammenhang und probiere es noch einmal.</div>';save()}
function homework(){head('Hausaufgaben','Aufgaben sammeln, erledigen und Fotos zur Unterstützung/Korrektur verwenden.');main.innerHTML+='<div class="card full" style="margin-top:24px"><div class="row"><input id="hw" placeholder="z. B. Mathe S. 42 Nr. 3d"><button class="btn primary" onclick="addHW()">Hinzufügen</button></div><div class="photoBox"><b>📷 Hausaufgabe fotografieren</b><p class="muted">Foto hochladen und mit LYRA bearbeiten. Mit KI-Backend wird die Aufgabe analysiert.</p><label class="btn">Foto auswählen<input id="hwphoto" type="file" accept="image/*" capture="environment" class="hidden" onchange="homeworkPhoto(this)"></label><div id="hwp"></div></div><div id="tl"></div></div>';drawHW()}
function addHW(){let x=hw.value.trim();if(x){D.tasks.push({text:x,done:false,created:new Date().toISOString()});save();homework();addXP(2)}}
function drawHW(){tl.innerHTML=D.tasks.length?D.tasks.map((x,i)=>'<div class="task '+(x.done?'done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="hwDone('+i+',this.checked)" style="width:auto"><span style="flex:1">'+esc(x.text)+'</span><button class="btn danger" onclick="hwDel('+i+')">Löschen</button></div>').join(''):'<div class="empty">Keine Hausaufgaben.</div>'}
function hwDone(i,v){D.tasks[i].done=v;if(v){addXP(5);markStudy()}save();drawHW()}function hwDel(i){D.tasks.splice(i,1);save();homework()}
async function homeworkPhoto(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=async()=>{hwp.innerHTML='<div class="feedback">📷 Foto geladen. '+(D.settings.geminiKey?'KI analysiert die Aufgabe …':'Für echte Aufgaben-Erkennung bitte KI-Backend verbinden.')+'</div>';if(D.settings.geminiKey){try{let out=await callBackend({message:'Analysiere diese Hausaufgabe. Erkläre zuerst, was gefragt ist, und hilf Schritt für Schritt ohne die Lösung sofort vorwegzunehmen.',image:r.result,context:buildContext()});hwp.innerHTML='<div class="feedback ok">'+esc(out)+'</div>'}catch(e){hwp.innerHTML='<div class="feedback bad">KI-Fotoanalyse nicht erreichbar.</div>'}}};r.readAsDataURL(f)}
function tests(){head('Klassenarbeiten','Planen, vorbereiten und später echte Prüfungen üben. Der Prüfungsmodus bleibt gesperrt, bis du ihn aktivierst.');let enabled=D.settings.classTestsEnabled;main.innerHTML+='<div class="grid"><div class="card full"><div class="notice">'+(enabled?'▣ Klassenarbeitsmodus ist aktiviert.':'🔒 Klassenarbeitsmodus ist derzeit gesperrt. Aktiviere ihn später in den Einstellungen.')+'</div></div><div class="card wide"><h3>📝 Arbeit planen</h3><div class="row"><input id="exTitle" placeholder="z. B. Mathe-Arbeit"><select id="exSub">'+Object.keys(MATERIAL).map(s=>'<option>'+esc(s)+'</option>').join('')+'</select></div><div class="row" style="margin-top:8px"><input id="exDate" type="date"><select id="exPri"><option value="2">Normal</option><option value="3">Hoch</option><option value="1">Niedrig</option></select><input id="exWeeks" type="number" min="0" max="8" value="'+(D.settings.autoExamWeeks||2)+'" title="Wochen vorher"></div><textarea id="exTopics" rows="3" style="margin-top:8px" placeholder="Stoff/Themen, z. B. Quadratische Funktionen, Nullstellen …"></textarea><textarea id="exNote" rows="2" style="margin-top:8px" placeholder="Eigene Notizen …"></textarea><button class="btn gold" style="margin-top:8px" onclick="addExam()">Arbeit speichern</button></div><div class="card"><h3>Automatik</h3><p class="muted">Wenn eine Arbeit innerhalb des eingestellten Zeitraums liegt, bekommt sie Vorrang in der Planung.</p><div class="metric">'+D.exams.length+'</div><div class="muted">geplante Arbeiten</div></div><div class="card full"><h3>📅 Geplante Arbeiten</h3>'+drawExams()+'</div><div class="card full"><h3>▣ Prüfung starten</h3><p class="muted">Nur wenn der Klassenarbeitsmodus aktiviert ist.</p><select id="ts" '+(enabled?'':'disabled')+'>'+Object.keys(MATERIAL).map(s=>'<option>'+esc(s)+'</option>').join('')+'</select><div class="row" style="margin-top:8px"><select id="difficulty" '+(enabled?'':'disabled')+'><option>Standard</option><option>Schwer</option><option>Prüfungsmodus</option></select><button class="btn primary" '+(enabled?'':'disabled')+' onclick="startTest()">Starten</button></div><div id="ta"></div></div></div>'}
function drawExams(){if(!D.exams.length)return '<div class="empty">Noch keine Arbeiten geplant.</div>';let now=Date.now();return D.exams.map((e,i)=>{let days=Math.ceil((new Date(e.date)-now)/86400000),cls=days<=3?'urgent':days<=14?'near':'';return '<div class="exam '+cls+'"><b>'+esc(e.title)+'</b> · '+ICON[e.subject]+' '+esc(e.subject)+'<br><span class="muted">📅 '+new Date(e.date).toLocaleDateString('de-DE')+' · '+(days>=0?days+' Tage':'vorbei')+' · Priorität '+esc(e.priority||'2')+'</span><p class="muted">📚 '+esc(e.topics||'Kein Stoff eingetragen')+'</p><p class="small">'+esc(e.note||'')+'</p><button class="btn danger" onclick="delExam('+i+')">Löschen</button></div>'}).join('')}
function addExam(){let title=exTitle.value.trim(),date=exDate.value;if(!title||!date){toast('Titel und Datum fehlen');return}D.exams.push({title,date,subject:exSub.value,topics:exTopics.value.trim(),note:exNote.value.trim(),priority:exPri.value,active:true});save();tests();toast('Arbeit geplant')}
function delExam(i){D.exams.splice(i,1);save();tests()}
function startTest(){let s=ts.value,arr=MATERIAL[s],t=arr[Math.floor(Math.random()*arr.length)],l=LESSON[t],q=l?l[1]:'Erkläre '+t+' auf Prüfungsniveau und nenne ein passendes Beispiel.';ta.innerHTML='<div class="feedback"><b>Aufgabe · '+esc(t)+'</b><p>'+esc(q)+'</p><label class="btn">📷 Lösung fotografieren<input id="testPhoto" type="file" accept="image/*" capture="environment" class="hidden" onchange="testPhotoPreview(this)"></label><textarea id="ans" rows="6" placeholder="Oder Lösungsweg / Antwort hier …" style="margin-top:8px"></textarea><button class="btn primary" style="margin-top:8px" onclick="finishTest(\''+esc(s)+'\',\''+esc(t)+'\')">Abgeben</button><div id="tf"></div></div>'}
function testPhotoPreview(input){let f=input.files[0];if(f){tf.innerHTML='<div class="feedback">📷 Prüfungsfoto geladen. Mit KI-Backend kann LYRA es automatisch analysieren und korrigieren.</div>'}}
function finishTest(s,t){let a=ans?.value.trim()||'';D.tests.push({subject:s,topic:t,date:new Date().toLocaleString('de-DE'),answer:a});save();addXP(30);tf.innerHTML='<div class="feedback ok">Antwort gespeichert. +30 XP. Für automatische Bewertung freier Antworten und Fotos bitte die sichere KI-Verbindung aktivieren.</div>'}
function progress(){head('Fortschritt','Dein Cockpit für XP, Level, Themen, Fehler, Streaks und Achievements.');let st=daysStreak(),ach=[['Erstes Thema',doneCount()>=1,'Ein Thema abgeschlossen'],['7-Tage-Streak',st>=7,'7 Tage in Folge gelernt'],['10-Tage-Streak',st>=10,'10 Tage in Folge gelernt'],['10 Themen',doneCount()>=10,'10 Themen abgeschlossen'],['Level 5',lvl()>=5,'Level 5 erreicht'],['50 Vokabeln',D.vocab.length>=50,'50 Vokabeln gespeichert'],['Quiz-Profi',D.quiz>=10,'10 Quizfragen richtig beantwortet'],['Prüfungsbereit',doneCount()>=Math.ceil(topics().length*.7),'Großer Teil des Lernstoffs gemeistert']];main.innerHTML+='<div class="grid"><div class="card"><div class="metric">'+lvl()+'</div><div class="muted">Level</div></div><div class="card"><div class="metric">'+D.xp+'</div><div class="muted">XP</div></div><div class="card"><div class="metric">'+doneCount()+'</div><div class="muted">Themen</div></div><div class="card"><div class="metric">'+st+' 🔥</div><div class="muted">aktuelle Streak</div></div><div class="card full"><h3>🏆 Achievements</h3><div class="grid">'+ach.map(a=>'<div class="card achievement '+(a[1]?'':'locked')+'"><b>'+(a[1]?'🏅':'🔒')+' '+a[0]+'</b><div class="muted">'+a[2]+'</div></div>').join('')+'</div></div><div class="card full"><h3>Fachfortschritt</h3>'+Object.entries(MATERIAL).map(([s,a])=>'<div class="subject"><div class="subjectHead"><b>'+ICON[s]+' '+esc(s)+'</b><b>'+pct(s)+'%</b></div><div class="bar"><div class="fill" style="width:'+pct(s)+'%"></div></div><div class="muted" style="margin-top:6px">'+(D.done[s]?.length||0)+' / '+a.length+' Themen</div></div>').join('')+'</div><div class="card full"><h3>Fehler zum Wiederholen</h3>'+((D.errors||[]).length?D.errors.map(e=>'<span class="tag">'+ICON[e.subject]+' '+esc(e.topic)+'</span>').join(''):'<div class="empty">Keine gespeicherten Fehler.</div>')+'</div></div>'}
function plan(){head('Lernplan','Eigene Lerntage, Fächer und automatische Priorisierung anstehender Arbeiten.');let p=D.settings.plan||DEFAULT_PLAN;main.innerHTML+='<div class="card full"><h3>📅 Wochenplan</h3><div class="calendar">'+Object.keys(DEFAULT_PLAN).map(d=>'<div class="day"><b>'+d+'</b><select id="pd_'+d+'" style="margin-top:8px"><option value="">Freie Übung / Planung</option>'+Object.keys(MATERIAL).map(s=>'<option '+(p[d]===s?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select></div>').join('')+'</div><div class="row" style="margin-top:12px"><input id="mins" type="number" min="10" max="300" value="'+(D.settings.dailyMinutes||60)+'" placeholder="Minuten pro Lerntag"><button class="btn primary" onclick="savePlan()">Plan speichern</button></div></div><div class="card full"><h3>🎓 Stoff-Checkliste Klasse 10</h3>'+Object.entries(MATERIAL).map(([s,a])=>'<details class="subject"><summary><b>'+ICON[s]+' '+esc(s)+'</b> · '+pct(s)+'%</summary>'+a.map((t,i)=>'<div class="topic"><span>'+((D.done[s]||[]).includes(t)?'✅':'⬜')+' '+(i+1)+'. '+esc(t)+'</span></div>').join('')+'</details>').join('')+'</div>'}
function savePlan(){let p={};Object.keys(DEFAULT_PLAN).forEach(d=>p[d]=document.getElementById('pd_'+d).value||'Wiederholung / freie Übung');D.settings.plan=p;D.settings.dailyMinutes=Math.max(10,Number(mins.value)||60);save();toast('Lernplan gespeichert');plan()}
function notes(){head('Notizen','Eigene Schulnotizen und Dinge, die du nicht vergessen möchtest.');main.innerHTML+='<div class="card full"><div class="row"><input id="nt" placeholder="Notiz oder Aufgabe …"><button class="btn primary" onclick="addNote()">＋ Speichern</button></div><div id="nl"></div></div>';drawNotes()}
function addNote(){let x=nt.value.trim();if(!x)return;D.notes.push({text:x,date:new Date().toLocaleString('de-DE'),done:false});save();notes();}
function drawNotes(){nl.innerHTML=D.notes.length?D.notes.slice().reverse().map((n,ri)=>{let i=D.notes.length-1-ri;return '<div class="task '+(n.done?'done':'')+'"><input type="checkbox" '+(n.done?'checked':'')+' onchange="noteDone('+i+',this.checked)" style="width:auto"><span style="flex:1">'+esc(n.text)+'<div class="muted small">'+esc(n.date)+'</div></span><button class="btn danger" onclick="delNote('+i+')">Löschen</button></div>'}).join(''):'<div class="empty">Keine Notizen.</div>'}
function noteDone(i,v){D.notes[i].done=v;save();drawNotes()}function delNote(i){D.notes.splice(i,1);save();notes()}
function settings(){head('Einstellungen','LYRA an deine Arbeitsweise anpassen. Änderungen werden auf diesem Gerät gespeichert.');let rules=[...DEFAULT_RULES,...(D.settings.customRules||[])];main.innerHTML+='<div class="grid"><div class="card"><h3>Profil</h3><input id="name" value="'+esc(D.settings.name)+'" placeholder="Name"><button class="btn primary" style="margin-top:9px" onclick="saveName()">Speichern</button></div><div class="card"><h3>🎛️ Lernmodus</h3><select id="modeSet" onchange="D.settings.mode=this.value;save()"><option value="ipad" '+(D.settings.mode==='ipad'?'selected':'')+'>🖥️ Aufgaben auf dem iPad</option><option value="heft" '+(D.settings.mode==='heft'?'selected':'')+'>📓 Im Heft + Foto-Korrektur</option></select><p class="muted">Du kannst den Modus auch direkt im Lernbereich wechseln.</p></div><div class="card"><h3>📅 Automatik</h3><label class="muted">Wochen vor Arbeit</label><input id="autoWeeks" type="number" min="0" max="8" value="'+(D.settings.autoExamWeeks??2)+'"><label class="muted">Lerntage pro Woche</label><div>'+['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'].map(d=>'<label class="tag"><input type="checkbox" id="day_'+d+'" '+((D.settings.studyDays||[]).includes(d)?'checked':'')+'> '+d+'</label>').join('')+'</div><button class="btn primary" style="margin-top:9px" onclick="saveAuto()">Automatik speichern</button></div><div class="card full"><h3>🤖 Gemini-KI</h3><p class="muted">Hier deinen Gemini API-Key eintragen. Das ist der einfache direkte Weg für deine persönliche App. Teile die fertige App mit diesem Schlüssel nicht öffentlich.</p><input id="geminiKey" type="password" value="'+esc(D.settings.geminiKey||'')+'" placeholder="Gemini API-Key"><button class="btn primary" style="margin-top:9px" onclick="saveGemini()">Gemini-KI speichern</button><p class="small muted">Danach funktionieren KI-Chat und Fotoanalyse direkt über Gemini – ohne Claude und ohne Cloudflare-KI.</p></div><div class="card full"><h3>⚙️ Eigene Lernregeln</h3><p class="muted">Diese Regeln werden zusätzlich zu den festen LYRA-Lernregeln gespeichert und bei einer KI-Verbindung an das Backend übergeben.</p><div class="row"><input id="newRule" placeholder="Eigene Regel …"><button class="btn primary" onclick="addRule()">Regel hinzufügen</button></div><div id="rulesBox">'+rules.map((r,i)=>'<div class="task"><span>✓</span><span style="flex:1">'+esc(r)+'</span>'+((i>=DEFAULT_RULES.length)?'<button class="btn danger" onclick="delRule('+(i-DEFAULT_RULES.length)+')">×</button>':'')+'</div>').join('')+'</div></div><div class="card full"><h3>▣ Klassenarbeiten</h3><p class="muted">Der Prüfungsmodus ist zunächst gesperrt. Aktiviere ihn nur, wenn du ihn verwenden möchtest.</p><button class="btn '+(D.settings.classTestsEnabled?'gold':'primary')+'" onclick="toggleTests()">'+(D.settings.classTestsEnabled?'🔓 Klassenarbeiten aktiv':'🔒 Klassenarbeiten gesperrt')+'</button></div><div class="card full"><h3>💾 Daten</h3><p class="muted">Lernstand, Plan, Arbeiten, Notizen, Vokabeln, Regeln, XP und Achievements werden lokal gespeichert.</p><button class="btn danger" onclick="resetData()">Alles zurücksetzen</button></div></div>'}
function saveName(){D.settings.name=name.value.trim()||'Danny';save();toast('Profil gespeichert')}
function saveAuto(){D.settings.autoExamWeeks=Math.max(0,Number(autoWeeks.value)||0);D.settings.studyDays=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'].filter(d=>document.getElementById('day_'+d).checked);save();toast('Lernregeln gespeichert')}
function saveGemini(){D.settings.geminiKey=geminiKey.value.trim();save();toast(D.settings.geminiKey?'Gemini-KI gespeichert':'Gemini-Key fehlt')}
function addRule(){let r=newRule.value.trim();if(!r)return;D.settings.customRules=D.settings.customRules||[];D.settings.customRules.push(r);save();settings()}
function delRule(i){D.settings.customRules.splice(i,1);save();settings()}
function toggleTests(){D.settings.classTestsEnabled=!D.settings.classTestsEnabled;save();settings()}
function resetData(){if(confirm('Wirklich deinen gesamten LYRA-Lernstand löschen?')){localStorage.removeItem('LYRA_3');localStorage.removeItem('LYRA_2');location.reload()}}
// Automatische Prüfungsvorbereitung als Plan-Hinweis: echte Umplanung erfolgt anhand gespeicherter Arbeiten.
function examPriority(){let now=Date.now();return D.exams.filter(e=>e.active!==false).map(e=>{let days=Math.ceil((new Date(e.date)-now)/86400000);return {...e,days}}).filter(e=>e.days>=0&&e.days<=(Number(D.settings.autoExamWeeks)||2)*7).sort((a,b)=>(b.priority||2)-(a.priority||2)||a.days-b.days)}
save();dashboard();
</script>
</body></html>
