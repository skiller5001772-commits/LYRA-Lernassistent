main{max-width:1250px;width:100%;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px}.eyebrow{font-size:10px;color:var(--cyan);letter-spacing:.2em}.title{font-size:43px;line-height:1.05;margin:7px 0}.desc{color:var(--muted);max-width:850px}.levelbox{text-align:right;min-width:190px}.level{font-size:28px;font-weight:900;color:var(--gold)}.bar{height:7px;background:#0b222c;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#1ca8d0,var(--cyan));border-radius:99px;transition:.25s}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:24px}.card{grid-column:span 4;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:17px}.wide{grid-column:span 8}.full{grid-column:1/-1}.metric{font-size:33px;font-weight:900}.muted{color:var(--muted);font-size:13px}.small{font-size:11px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 8px;color:var(--cyan);font-size:10px}.btn{border:1px solid #32758e;background:#092532;color:var(--text);border-radius:9px;padding:10px 13px;cursor:pointer}.btn:hover{border-color:var(--cyan);box-shadow:0 0 14px #0e4655}.btn.primary{border-color:#55bdd8;background:#0c3545}.btn.gold{border-color:#856d38;background:#30270f}.btn.danger{border-color:#693543;background:#251018}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}input,select,textarea{width:100%;background:#051118;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;outline:0}textarea{resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--cyan)}.task{display:flex;gap:9px;align-items:center;border-bottom:1px solid #14323e;padding:11px 0}.task.done span{text-decoration:line-through;opacity:.5}.subject{border:1px solid var(--line);border-radius:11px;padding:13px;margin:8px 0;background:#06141d}.subjectHead{display:flex;justify-content:space-between}.topic{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #13303a}.chat{max-height:520px;overflow:auto}.msg{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;white-space:pre-wrap}.me{margin-left:13%;background:#0a2735}.lyra{margin-right:13%;background:#06141d}.feedback{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:12px}.ok{border-color:#287d60}.bad{border-color:#82394b}.qopt{display:block;width:100%;text-align:left;margin:7px 0;padding:12px;background:#06141d;color:var(--text);border:1px solid var(--line);border-radius:10px;cursor:pointer}.qopt:hover{border-color:var(--cyan)}.achievement{border:1px solid var(--line);border-radius:12px;padding:13px}.locked{opacity:.42;filter:grayscale(.7)}details{margin-top:8px}.toast{position:fixed;right:18px;bottom:18px;background:#0b2733;border:1px solid var(--cyan);border-radius:10px;padding:12px;display:none;z-index:50;box-shadow:0 8px 30px #000}.photoBox{border:1px dashed #32758e;border-radius:12px;padding:14px;margin-top:10px;background:#06141d}.preview{max-width:100%;max-height:260px;border-radius:10px;margin-top:10px;display:block}.tag{display:inline-block;padding:5px 8px;border:1px solid var(--line);border-radius:999px;margin:3px;font-size:11px;color:var(--muted)}.notice{border-left:3px solid var(--gold);padding:10px;background:#17140b;border-radius:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:100px}.day b{color:var(--cyan)}.exam{border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;background:#06141d}.exam.near{border-color:#856d38}.exam.urgent{border-color:#82394b}.mode{display:flex;gap:8px;flex-wrap:wrap}.mode .btn.selected{border-color:var(--cyan);box-shadow:0 0 12px #0e4655;background:#0d3444}.stat{font-size:25px;font-weight:900;margin-top:8px}.empty{color:var(--muted);padding:15px}.hidden{display:none!important}.worksheet{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px;background:#06141d}.workhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.worktask{border:1px solid #173b48;border-radius:12px;padding:14px;margin-top:10px;background:#071821}.solution{display:none;border-left:3px solid var(--gold);padding:10px;margin-top:9px;background:#17140b;border-radius:8px}.solution.show{display:block}.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.loading{display:inline-flex;gap:7px;align-items:center}.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.status{font-size:11px;color:var(--muted)}@media(max-width:820px){.app{display:block}aside{height:auto;position:sticky;z-index:30;border-right:0;border-bottom:1px solid var(--line);padding:7px}.logo{padding:5px 8px}nav{display:flex;overflow:auto;margin:6px 0}nav button{white-space:nowrap;padding:8px}.online{display:none}main{padding:17px}.top{display:block}.levelbox{text-align:left;margin-top:12px}.card,.wide{grid-column:1/-1}.title{font-size:34px}.row{flex-wrap:wrap}.row>*{min-width:140px}.calendar{grid-template-columns:1fr}.day{min-height:auto}}

settings:{name:"Danny",theme:"system",mode:"ipad",classTestsEnabled:false,studyDays:["Montag","Mittwoch","Freitag"],dailyMinutes:60,autoExamWeeks:2,customRules:[],studyHistory:[]},
exams:[],notes:[],topicStudy:{},chat:[],materialHistory:[]
};

function loadData(){
  try{
    const current=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    const legacy=current||JSON.parse(localStorage.getItem("LYRA_3")||localStorage.getItem("LYRA_2")||"null")||{};
    const d=structuredClone(DEFAULT_DATA);
    Object.assign(d,legacy);
    d.settings=Object.assign({},DEFAULT_DATA.settings,legacy.settings||{});
    d.done=legacy.done||{};d.tasks=legacy.tasks||[];d.vocab=legacy.vocab||[];d.errors=legacy.errors||[];
    d.exams=legacy.exams||[];d.notes=legacy.notes||[];d.topicStudy=legacy.topicStudy||{};d.chat=legacy.chat||[];
    return d;
  }catch(e){return structuredClone(DEFAULT_DATA)}
}
let D=loadData();

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(D))}catch(e){toast("Speichern fehlgeschlagen")}}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function topics(){return Object.entries(MATERIAL).flatMap(([s,a])=>a.map(t=>[s,t]))}
function doneCount(){return Object.values(D.done).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0)}
function next(s){return (MATERIAL[s]||[]).find(t=>!(D.done[s]||[]).includes(t))||"Alle Themen gemeistert"}
function pct(s){return Math.round(((D.done[s]||[]).length/(MATERIAL[s]?.length||1))*100)}
function lvl(){return Math.floor(D.xp/100)+1}
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",1800)}
function addXP(n){D.xp=Math.max(0,D.xp+Number(n||0));save();toast("+"+n+" XP")}
function head(title,desc){main.innerHTML='<div class="top"><div><div class="eyebrow">LYRA // LEARNING COMMAND SYSTEM</div><h1 class="title">'+esc(title)+'</h1><div class="desc">'+esc(desc)+'</div></div><div class="levelbox"><div class="level">LEVEL '+lvl()+'</div><div class="muted">'+(D.xp%100)+' / 100 XP</div><div class="bar"><div class="fill" style="width:'+(D.xp%100)+'%"></div></div></div></div>'}

function todayKey(){return new Date().toISOString().slice(0,10)}
function daysStreak(){const s=new Set(D.settings.studyHistory||[]);let n=0,d=new Date();while(s.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function markStudy(){D.settings.studyHistory=D.settings.studyHistory||[];const k=todayKey();if(!D.settings.studyHistory.includes(k))D.settings.studyHistory.push(k);save()}
function topicKey(s,t){return s+"::"+t}
function topicState(s,t){return D.topicStudy[topicKey(s,t)]||{days:[],level:0,attempts:0,mastered:false,testAsked:false,testPassed:false}}
function saveTopicState(s,t,st){D.topicStudy[topicKey(s,t)]=st;save()}
function normalize(a){return String(a||"").toLowerCase().replace(/[.,!?;:]/g," ").replace(/\s+/g," ").trim()}

function markTopicDay(s,t){const st=topicState(s,t),d=todayKey();if(!st.days.includes(d))st.days.push(d);st.lastWorked=d;markStudy();saveTopicState(s,t,st)}
function taskBank(s,t,level){
  const bank=TASK_BANK[t];
  if(bank)return [bank[level%4],bank[(level+1)%4],bank[(level+2)%4]];
  const generic=[
  ["leicht","Erkläre "+t+" in 1–2 einfachen Sätzen mit deinen eigenen Worten.","","Nutze die wichtigsten Fachbegriffe."],
  ["mittel","Nenne ein Beispiel zu "+t+" und erkläre kurz, warum es dazu passt.","","Beispiel nennen und begründen."],
  ["schwer","Bearbeite eine typische Klasse-10-Aufgabe zu "+t+" und erkläre deinen Lösungsweg.","","Achte auf einen vollständigen Lösungsweg."],
  ["anspruchsvoll","Bearbeite eine anspruchsvolle Transferaufgabe zu "+t+" und begründe deine Entscheidung.","","Überlege zuerst, welches Wissen aus dem Thema du anwenden musst."]
  ];
  return [generic[level%4],generic[(level+1)%4],generic[(level+2)%4]];
}

  }else{
    body+='<div class="worksheet"><div class="workhead"><h3>🖥️ Aufgaben auf dem iPad</h3><span class="pill">STUFE '+(level+1)+'</span></div><p class="muted">Die Aufgaben werden mit steigender Stufe anspruchsvoller.</p>';
    tasks.forEach((x,i)=>body+='<div class="worktask"><b>Aufgabe '+(i+1)+' · '+x[0]+'</b><p>'+esc(x[1])+'</p><input id="wa'+i+'" placeholder="Deine Antwort …"><div class="row" style="margin-top:8px"><button type="button" class="btn primary" onclick="checkWorksheet('+i+')">Prüfen</button><button type="button" class="btn" onclick="showSolution('+i+')">💡 Lösungsweg</button></div><div id="wf'+i+'"></div><div id="sol'+i+'" class="solution"><b>Lösungsweg:</b><br>'+esc(x[3])+'</div></div>');
    body+='</div>';
  }
  body+='<p class="muted small">Ein Thema wird erst abgeschlossen, wenn es mindestens an 2 Lerntagen bearbeitet, auf anspruchsvoller Stufe sicher beherrscht und der Abschlusstest bestanden wurde.</p>';
  if(canTest)body+='<div class="notice"><b>🏁 Bereit für den Abschlusstest?</b><br>Du hast dieses Thema an '+st.days.length+' verschiedenen Lerntagen bis zur anspruchsvollen Stufe geübt.<div class="row" style="margin-top:8px"><button type="button" class="btn gold" onclick="askFinal(\''+esc(s)+'\',\''+esc(t)+'\')">Ja, Abschlusstest machen</button><button type="button" class="btn" onclick="continueTopic()">Noch weiter üben</button></div></div>';

function showSolution(i){document.getElementById("sol"+i)?.classList.toggle("show")}
function checkWorksheet(i){
  const item=window.currentWorksheet?.tasks?.[i],el=document.getElementById("wa"+i),out=document.getElementById("wf"+i);
  if(!item||!el||!out)return;
  const a=normalize(el.value);if(!a){out.innerHTML='<div class="feedback bad">Bitte versuche die Aufgabe zuerst selbst.</div>';return}
  const expected=normalize(item[2]),ok=expected&&a===expected;
  const s=window.currentWorksheet.subject,t=window.currentWorksheet.topic,st=topicState(s,t);
  st.attempts++;
  if(ok){
    st.level=Math.min(3,Math.max(st.level||0,(st.level||0)+1));
    D.errors=(D.errors||[]).filter(x=>!(x.subject===s&&x.topic===t));
    markTopicDay(s,t);addXP(8+st.level*2);
    out.innerHTML='<div class="feedback ok">✅ Richtig. Sehr gut – die Schwierigkeit kann steigen.</div>';
    saveTopicState(s,t,st);setTimeout(loadLesson,650);
  }else{
    if(!D.errors.some(x=>x.subject===s&&x.topic===t))D.errors.push({subject:s,topic:t});
    saveTopicState(s,t,st);save();
    out.innerHTML='<div class="feedback bad">❌ Noch nicht richtig. Lies den Lösungsweg nur, wenn du wirklich nicht weiterkommst, und versuche es danach erneut.</div>';
  }
}
function askFinal(s,t){
  if(!confirm("Bist du bereit für den Abschlusstest zu „"+t+"“?"))return;
  const l=LESSON[t],q=l?l[1]:"Erkläre "+t+" auf anspruchsvollem Niveau und nenne ein passendes Beispiel.";
  lesson.innerHTML+='<div class="feedback" id="finalBox"><b>🏁 Abschlusstest</b><p>'+esc(q)+'</p><textarea id="fa" rows="5" placeholder="Deine Lösung …"></textarea><button type="button" class="btn gold" style="margin-top:8px" onclick="finishFinal(\''+esc(s)+'\',\''+esc(t)+'\')">Abschlusstest abgeben</button><div id="ff"></div></div>';
  document.getElementById("finalBox")?.scrollIntoView({behavior:"smooth"});
}
function finishFinal(s,t){
  const a=normalize(document.getElementById("fa")?.value);if(!a)return;
  const st=topicState(s,t),l=LESSON[t],correct=l?.[2]?normalize(l[2]):null;
  const ok=correct&&(a===correct||(t==="Erörterung"&&a.includes("behaupt")&&a.includes("begründ")&&a.includes("beispiel")));
  if(ok){
    st.mastered=true;st.testPassed=true;D.done[s]=D.done[s]||[];if(!D.done[s].includes(t))D.done[s].push(t);
    D.errors=(D.errors||[]).filter(x=>!(x.subject===s&&x.topic===t));saveTopicState(s,t,st);addXP(35);
    ff.innerHTML='<div class="feedback ok">🏆 Sicher gemeistert. Thema abgeschlossen.</div><button type="button" class="btn primary" onclick="loadLesson()">Nächstes Thema →</button>';
  }else{
    if(!D.errors.some(x=>x.subject===s&&x.topic===t))D.errors.push({subject:s,topic:t});
    st.testPassed=false;saveTopicState(s,t,st);save();ff.innerHTML='<div class="feedback bad">❌ Noch nicht sicher genug für den Abschluss. Das Thema bleibt offen und wird weiter geübt.</div>';addXP(2);
  }
}

async async function sendChat(){
  const input=document.getElementById("ci");if(!input)return;
  const x=input.value.trim();if(!x&&!pendingChatImageData)return;
  const sendBtn=input.parentElement?.querySelector("button");
  if(sendBtn)sendBtn.disabled=true;
  appendChat("DU",x||"📷 Foto zur Analyse gesendet.");input.value="";
  const statusId="lyraStatus_"+Date.now();
  const c=document.getElementById("chat");
  if(c){c.innerHTML+='<div class="msg lyra" id="'+statusId+'"><span class="loading"><span class="spinner"></span> LYRA analysiert …</span></div>';c.scrollTop=c.scrollHeight}
  try{
    const history=(D.chat||[]).slice(-12).map(m=>({role:m.who==="DU"?"user":"assistant",content:m.text}));
    const payload={message:x||"Analysiere das angehängte Foto und erkläre mir, was darauf zu sehen ist.",image:pendingChatImageData||null,history,context:buildAIContext()};
    const res=await fetch(getBackendUrl(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||"KI-Server nicht erreichbar.");
    const reply=data.text||"Die KI hat keine Antwort zurückgegeben.";
    document.getElementById(statusId)?.remove();
    appendChat("LYRA",reply);addXP(3);

    const el=document.getElementById(statusId);if(el)el.outerHTML='<div class="msg lyra"><b>LYRA</b><br>⚠️ '+esc(e.message)+'<br><span class="muted">Prüfe, ob das Backend läuft und OPENAI_API_KEY gesetzt ist.</span></div>';
  }finally{if(sendBtn)sendBtn.disabled=false}
}

async function prepareImage(file,maxSide=1600,quality=.82){
  if(!file||!file.type.startsWith("image/"))throw new Error("Bitte eine Bilddatei auswählen.");
  if(file.size>15*1024*1024)throw new Error("Das Bild ist zu groß. Bitte ein kleineres Foto verwenden.");
  const bitmap=await createImageBitmap(file);
  const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const ctx=canvas.getContext("2d");ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("Bild konnte nicht vorbereitet werden.")),"image/jpeg",quality));
}
function blobUrl(blob){return URL.createObjectURL(blob)}
async function blobToDataUrl(blob){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error("Bild konnte nicht gelesen werden."));r.readAsDataURL(blob)})}

function vocab(){
  head("Vokabeln","Vokabeln manuell speichern oder später per KI-Fotoanalyse aus deinem Buch übernehmen.");
  main.innerHTML+='<div class="grid"><div class="card wide"><h3>Vokabel hinzufügen</h3><div class="row"><input id="vd" placeholder="Deutsch"><input id="ve" placeholder="Englisch"><button type="button" class="btn primary" onclick="addV()">＋</button></div><div class="photoBox"><b>📷 Vokabeln per Foto</b><p class="muted">Das Foto wird lokal optimiert und kann anschließend direkt von LYRA analysiert werden.</p><label class="btn">Foto auswählen<input id="vphoto" type="file" accept="image/*" capture="environment" class="hidden" onchange="vocabPhoto(this)"></label><div id="vpr"></div></div><div id="vl" style="margin-top:10px"></div></div><div class="card"><h3>Training</h3><div class="metric">'+D.vocab.length+'</div><div class="muted">gespeicherte Wörter</div><button type="button" class="btn primary" style="margin-top:12px" onclick="vStart()">📚 Lernen</button><div id="vq"></div></div></div>';drawV();
}
function addV(){const d=vd.value.trim(),e=ve.value.trim();if(!d||!e)return;D.vocab.push({d,e,ok:0});save();vocab();addXP(2)}
function drawV(){vl.innerHTML=D.vocab.length?D.vocab.map((v,i)=>'<div class="task"><span style="flex:1">'+esc(v.d)+' → '+esc(v.e)+'</span><button type="button" class="btn danger" onclick="delV('+i+')">×</button></div>').join(""):'<div class="empty">Noch keine Vokabeln gespeichert.</div>'}
function delV(i){D.vocab.splice(i,1);save();vocab()}
function vStart(){if(!D.vocab.length){vq.innerHTML='<div class="feedback bad">Bitte zuerst Vokabeln hinzufügen.</div>';return}const i=Math.floor(Math.random()*D.vocab.length),v=D.vocab[i];vq.innerHTML='<div class="feedback" style="margin-top:12px"><b>Übersetze:</b><div class="metric">'+esc(v.d)+'</div><div class="row"><input id="va" placeholder="Englisch …"><button type="button" class="btn" onclick="vCheck('+i+')">Prüfen</button></div><div id="vf"></div></div>'}
function vCheck(i){const v=D.vocab[i],a=normalize(document.getElementById("va")?.value);if(a===normalize(v.e)){v.ok++;vf.innerHTML='<div class="feedback ok">✅ Richtig · +10 XP</div>';addXP(10)}else vf.innerHTML='<div class="feedback bad">❌ Noch nicht. Versuch es noch einmal.</div>';save()}

const Q=[["Mathematik","Wie lautet v bei s=120 km und t=2 h?",["60","240","30"],0],["Mathematik","Welche Seite ist die Hypotenuse?",["kürzeste","längste","Kathete"],1],["Deutsch","Ein gutes Argument enthält …",["nur Meinung","Behauptung, Begründung, Beispiel/Beleg","nur Zitat"],1],["Englisch","Yesterday I … to school.",["go","went","gone"],1],["Physik","Einheit der Spannung?",["Ampere","Ohm","Volt"],2],["Chemie","pH 3 ist …",["sauer","neutral","basisch"],0]];
function quiz(){const q=Q[Math.floor(Math.random()*Q.length)];head("Quiz & Training","Gemischte Kurzfragen. Richtige Antworten bringen XP und verbessern deine Trainingsstatistik.");main.innerHTML+='<div class="card full" style="margin-top:24px"><span class="pill">'+q[0]+'</span><h2>'+q[1]+'</h2>'+q[2].map((o,i)=>'<button type="button" class="qopt" onclick="qcheck('+i+','+q[3]+')">'+esc(o)+'</button>').join("")+'<div id="qf"></div><button type="button" class="btn" style="margin-top:10px" onclick="quiz()">Nächste Frage</button></div>'}
function qcheck(i,c){if(i===c){qf.innerHTML='<div class="feedback ok">✅ Richtig · +15 XP</div>';D.quiz++;addXP(15)}else qf.innerHTML='<div class="feedback bad">❌ Nicht ganz. Probiere es noch einmal.</div>';save()}

function homework(){head("Hausaufgaben","Aufgaben sammeln, erledigen und Fotos später mit LYRA analysieren lassen.");main.innerHTML+='<div class="card full" style="margin-top:24px"><div class="row"><input id="hw" placeholder="z. B. Mathe S. 42 Nr. 3d"><button type="button" class="btn primary" onclick="addHW()">Hinzufügen</button></div><div class="photoBox"><b>📷 Hausaufgabe fotografieren</b><p class="muted">Das Foto wird lokal optimiert und kann anschließend direkt von LYRA analysiert werden.</p><label class="btn">Foto auswählen<input id="hwphoto" type="file" accept="image/*" capture="environment" class="hidden" onchange="homeworkPhoto(this)"></label><div id="hwp"></div></div><div id="tl"></div></div>';drawHW()}
function addHW(){const x=hw.value.trim();if(x){D.tasks.push({text:x,done:false,created:new Date().toISOString()});save();homework();addXP(2)}}
function drawHW(){tl.innerHTML=D.tasks.length?D.tasks.map((x,i)=>'<div class="task '+(x.done?"done":"")+'"><input type="checkbox" '+(x.done?"checked":"")+' onchange="hwDone('+i+',this.checked)" style="width:auto"><span style="flex:1">'+esc(x.text)+'</span><button type="button" class="btn danger" onclick="hwDel('+i+')">Löschen</button></div>').join(""):'<div class="empty">Keine Hausaufgaben.</div>'}
function hwDone(i,v){D.tasks[i].done=v;if(v){addXP(5);markStudy()}save();drawHW()}function hwDel(i){D.tasks.splice(i,1);save();homework()}

function tests(){
  head("Klassenarbeiten","Planen, vorbereiten und später echte Prüfungen üben. Der Prüfungsmodus bleibt gesperrt, bis du ihn aktivierst.");
  const enabled=D.settings.classTestsEnabled;
  main.innerHTML+='<div class="grid"><div class="card full"><div class="notice">'+(enabled?"▣ Klassenarbeitsmodus ist aktiviert.":"🔒 Klassenarbeitsmodus ist derzeit gesperrt.")+'</div></div><div class="card wide"><h3>📝 Arbeit planen</h3><div class="row"><input id="exTitle" placeholder="z. B. Mathe-Arbeit"><select id="exSub">'+Object.keys(MATERIAL).map(s=>'<option>'+esc(s)+'</option>').join("")+'</select></div><div class="row" style="margin-top:8px"><input id="exDate" type="date"><select id="exPri"><option value="2">Normal</option><option value="3">Hoch</option><option value="1">Niedrig</option></select><input id="exWeeks" type="number" min="0" max="8" value="'+(D.settings.autoExamWeeks||2)+'"></div><textarea id="exTopics" rows="3" style="margin-top:8px" placeholder="Stoff/Themen …"></textarea><textarea id="exNote" rows="2" style="margin-top:8px" placeholder="Eigene Notizen …"></textarea><button type="button" class="btn gold" style="margin-top:8px" onclick="addExam()">Arbeit speichern</button></div><div class="card"><h3>Automatik</h3><p class="muted">Arbeiten können später die Lernplanung priorisieren.</p><div class="metric">'+D.exams.length+'</div><div class="muted">geplante Arbeiten</div></div><div class="card full"><h3>📅 Geplante Arbeiten</h3>'+drawExams()+'</div><div class="card full"><h3>▣ Prüfung starten</h3><select id="ts" '+(enabled?"":"disabled")+'>'+Object.keys(MATERIAL).map(s=>'<option>'+esc(s)+'</option>').join("")+'</select><div class="row" style="margin-top:8px"><select id="difficulty" '+(enabled?"":"disabled")+'><option>Standard</option><option>Schwer</option><option>Prüfungsmodus</option></select><button type="button" class="btn primary" '+(enabled?"":"disabled")+' onclick="startTest()">Starten</button></div><div id="ta"></div></div></div>';
}
function drawExams(){if(!D.exams.length)return '<div class="empty">Noch keine Arbeiten geplant.</div>';const now=Date.now();return D.exams.map((e,i)=>{const days=Math.ceil((new Date(e.date)-now)/86400000),cls=days<=3?"urgent":days<=14?"near":"";return '<div class="exam '+cls+'"><b>'+esc(e.title)+'</b> · '+ICON[e.subject]+' '+esc(e.subject)+'<br><span class="muted">📅 '+new Date(e.date).toLocaleDateString("de-DE")+' · '+(days>=0?days+" Tage":"vorbei")+'</span><p class="muted">📚 '+esc(e.topics||"Kein Stoff eingetragen")+'</p><p class="small">'+esc(e.note||"")+'</p><button type="button" class="btn danger" onclick="delExam('+i+')">Löschen</button></div>'}).join("")}
function addExam(){const title=exTitle.value.trim(),date=exDate.value;if(!title||!date){toast("Titel und Datum fehlen");return}D.exams.push({title,date,subject:exSub.value,topics:exTopics.value.trim(),note:exNote.value.trim(),priority:exPri.value,active:true});save();tests();toast("Arbeit geplant")}
function delExam(i){D.exams.splice(i,1);save();tests()}
function startTest(){const s=ts.value,arr=MATERIAL[s],t=arr[Math.floor(Math.random()*arr.length)],l=LESSON[t],q=l?l[1]:"Erkläre "+t+" auf Prüfungsniveau und nenne ein passendes Beispiel.";ta.innerHTML='<div class="feedback"><b>Aufgabe · '+esc(t)+'</b><p>'+esc(q)+'</p><label class="btn">📷 Lösung fotografieren<input id="testPhoto" type="file" accept="image/*" capture="environment" class="hidden" onchange="testPhotoPreview(this)"></label><textarea id="ans" rows="6" placeholder="Oder Lösungsweg / Antwort hier …" style="margin-top:8px"></textarea><button type="button" class="btn primary" style="margin-top:8px" onclick="finishTest(\''+esc(s)+'\',\''+esc(t)+'\')">Abgeben</button><div id="tf"></div></div>'}
function finishTest(s,t){const a=document.getElementById("ans")?.value.trim()||"";if(!a){toast("Bitte zuerst eine Antwort eingeben.");return}D.tests.push({subject:s,topic:t,date:new Date().toISOString(),answer:a});save();addXP(30);tf.innerHTML='<div class="feedback ok">Antwort gespeichert. +30 XP. Die KI-Bewertung erfolgt über das sichere Backend.</div>'}

function progress(){
  head("Fortschritt","Dein Cockpit für XP, Level, Themen, Fehler, Streaks und Achievements.");
  const st=daysStreak(),ach=[["Erstes Thema",doneCount()>=1,"Ein Thema abgeschlossen"],["7-Tage-Streak",st>=7,"7 Tage in Folge gelernt"],["10-Tage-Streak",st>=10,"10 Tage in Folge gelernt"],["10 Themen",doneCount()>=10,"10 Themen abgeschlossen"],["Level 5",lvl()>=5,"Level 5 erreicht"],["50 Vokabeln",D.vocab.length>=50,"50 Vokabeln gespeichert"],["Quiz-Profi",D.quiz>=10,"10 Quizfragen richtig beantwortet"],["Prüfungsbereit",doneCount()>=Math.ceil(topics().length*.7),"Großer Teil des Lernstoffs gemeistert"]];
  main.innerHTML+='<div class="grid"><div class="card"><div class="metric">'+lvl()+'</div><div class="muted">Level</div></div><div class="card"><div class="metric">'+D.xp+'</div><div class="muted">XP</div></div><div class="card"><div class="metric">'+doneCount()+'</div><div class="muted">Themen</div></div><div class="card"><div class="metric">'+st+' 🔥</div><div class="muted">Streak</div></div><div class="card full"><h3>🏆 Achievements</h3><div class="grid">'+ach.map(a=>'<div class="card achievement '+(a[1]?"":"locked")+'"><b>'+(a[1]?"🏅":"🔒")+' '+a[0]+'</b><div class="muted">'+a[2]+'</div></div>').join("")+'</div></div><div class="card full"><h3>Fachfortschritt</h3>'+Object.entries(MATERIAL).map(([s,a])=>'<div class="subject"><div class="subjectHead"><b>'+ICON[s]+' '+esc(s)+'</b><b>'+pct(s)+'%</b></div><div class="bar"><div class="fill" style="width:'+pct(s)+'%"></div></div><div class="muted" style="margin-top:6px">'+(D.done[s]?.length||0)+' / '+a.length+' Themen</div></div>').join("")+'</div><div class="card full"><h3>Fehler zum Wiederholen</h3>'+((D.errors||[]).length?D.errors.map(e=>'<span class="tag">'+ICON[e.subject]+' '+esc(e.topic)+'</span>').join(""):'<div class="empty">Keine gespeicherten Fehler.</div>')+'</div></div>';
}

function plan(){
  head("Lernplan","Eigene Lerntage, Fächer und automatische Priorisierung anstehender Arbeiten.");
  const p=D.settings.plan||DEFAULT_PLAN;
  main.innerHTML+='<div class="card full"><h3>📅 Wochenplan</h3><div class="calendar">'+Object.keys(DEFAULT_PLAN).map(d=>'<div class="day"><b>'+d+'</b><select id="pd_'+d+'" style="margin-top:8px"><option value="">Freie Übung / Planung</option>'+Object.keys(MATERIAL).map(s=>'<option value="'+esc(s)+'" '+(p[d]===s?"selected":"")+'>'+esc(s)+'</option>').join("")+'</select></div>').join("")+'</div><div class="row" style="margin-top:12px"><input id="mins" type="number" min="10" max="300" value="'+(D.settings.dailyMinutes||60)+'"><button type="button" class="btn primary" onclick="savePlan()">Plan speichern</button></div></div><div class="card full"><h3>🎓 Stoff-Checkliste Klasse 10</h3>'+Object.entries(MATERIAL).map(([s,a])=>'<details class="subject"><summary><b>'+ICON[s]+' '+esc(s)+'</b> · '+pct(s)+'%</summary>'+a.map((t,i)=>'<div class="topic"><span>'+((D.done[s]||[]).includes(t)?"✅":"⬜")+" "+(i+1)+". "+esc(t)+'</span></div>').join("")+'</details>').join("")+'</div>';
}
function savePlan(){const p={};Object.keys(DEFAULT_PLAN).forEach(d=>p[d]=document.getElementById("pd_"+d).value||"Wiederholung / freie Übung");D.settings.plan=p;D.settings.dailyMinutes=Math.max(10,Math.min(300,Number(mins.value)||60));save();toast("Lernplan gespeichert");plan()}

function notes(){head("Notizen","Eigene Schulnotizen und Dinge, die du nicht vergessen möchtest.");main.innerHTML+='<div class="card full"><div class="row"><input id="nt" placeholder="Notiz oder Aufgabe …"><button type="button" class="btn primary" onclick="addNote()">＋ Speichern</button></div><div id="nl"></div></div>';drawNotes()}
function addNote(){const x=nt.value.trim();if(!x)return;D.notes.push({text:x,date:new Date().toISOString(),done:false});save();notes()}
function drawNotes(){nl.innerHTML=D.notes.length?D.notes.slice().reverse().map((n,ri)=>{const i=D.notes.length-1-ri;return '<div class="task '+(n.done?"done":"")+'"><input type="checkbox" '+(n.done?"checked":"")+' onchange="noteDone('+i+',this.checked)" style="width:auto"><span style="flex:1">'+esc(n.text)+'<div class="muted small">'+new Date(n.date).toLocaleString("de-DE")+'</div></span><button type="button" class="btn danger" onclick="delNote('+i+')">Löschen</button></div>'}).join(""):'<div class="empty">Keine Notizen.</div>'}
function noteDone(i,v){D.notes[i].done=v;save();drawNotes()}function delNote(i){D.notes.splice(i,1);save();notes()}

function settings(){
  head("Einstellungen","Profil, Lernmodus und lokale Daten. Die spätere KI wird sicher über ein Backend angebunden – ohne API-Key im Browser.");
  const rules=[...DEFAULT_RULES,...(D.settings.customRules||[])];
  main.innerHTML+='<div class="grid">'+
  '<div class="card"><h3>Profil</h3><input id="name" value="'+esc(D.settings.name)+'" placeholder="Name"><button type="button" class="btn primary" style="margin-top:9px" onclick="saveName()">Speichern</button></div>'+
  '<div class="card"><h3>🎛️ Lernmodus</h3><select id="modeSet" onchange="D.settings.mode=this.value;save()"><option value="ipad" '+(D.settings.mode==="ipad"?"selected":"")+'>🖥️ Aufgaben auf dem iPad</option><option value="heft" '+(D.settings.mode==="heft"?"selected":"")+'>📓 Im Heft + Foto</option></select></div>'+
  '<div class="card"><h3>📅 Automatik</h3><label class="muted">Wochen vor Arbeit</label><input id="autoWeeks" type="number" min="0" max="8" value="'+(D.settings.autoExamWeeks??2)+'"><label class="muted">Lerntage pro Woche</label><div>'+["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"].map(d=>'<label class="tag"><input type="checkbox" id="day_'+d+'" '+((D.settings.studyDays||[]).includes(d)?"checked":"")+'> '+d+'</label>').join("")+'</div><button type="button" class="btn primary" style="margin-top:9px" onclick="saveAuto()">Automatik speichern</button></div>'+
  '<div class="card full"><h3>🤖 KI-Verbindung</h3><div class="notice">Backend-Schnittstelle vorbereitet. <b>Keinen Gemini-/OpenAI-Key hier im Browser speichern.</b></div><p class="muted">Geplant ist eine einzige sichere Schnittstelle wie <code>/api/ai</code>. Dort liegen später API-Key, Modellwahl, Limits und Bildverarbeitung.</p><div class="row"><input id="backendUrl" value="'+esc(D.settings.backend||"")+'" placeholder="z. B. https://deine-domain.de/api/ai"><button type="button" class="btn primary" onclick="saveBackend()">Backend speichern</button></div></div>'+
  '<div class="card full"><h3>⚙️ Eigene Lernregeln</h3><div class="row"><input id="newRule" placeholder="Eigene Regel …"><button type="button" class="btn primary" onclick="addRule()">Regel hinzufügen</button></div><div id="rulesBox">'+rules.map((r,i)=>'<div class="task"><span>✓</span><span style="flex:1">'+esc(r)+'</span>'+((i>=DEFAULT_RULES.length)?'<button type="button" class="btn danger" onclick="delRule('+(i-DEFAULT_RULES.length)+')">×</button>':"")+'</div>').join("")+'</div></div>'+
  '<div class="card full"><h3>▣ Klassenarbeiten</h3><p class="muted">Der Prüfungsmodus ist zunächst gesperrt.</p><button type="button" class="btn '+(D.settings.classTestsEnabled?"gold":"primary")+'" onclick="toggleTests()">'+(D.settings.classTestsEnabled?"🔓 Klassenarbeiten aktiv":"🔒 Klassenarbeiten gesperrt")+'</button></div>'+
  '<div class="card full"><h3>💾 Daten</h3><p class="muted">Dein aktueller Prototyp speichert lokal. Für Verkauf/Mehrgerätebetrieb kommt später eine echte Benutzer-Datenbank.</p><div class="row"><button type="button" class="btn" onclick="exportData()">Daten exportieren</button><button type="button" class="btn danger" onclick="resetData()">Alles zurücksetzen</button></div></div>'+
  '</div>';
}
function saveName(){D.settings.name=document.getElementById("name").value.trim()||"Danny";save();toast("Profil gespeichert")}
function saveBackend(){D.settings.backend=document.getElementById("backendUrl").value.trim();save();toast("Backend-Adresse gespeichert")}
function saveAuto(){D.settings.autoExamWeeks=Math.max(0,Number(autoWeeks.value)||0);D.settings.studyDays=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"].filter(d=>document.getElementById("day_"+d).checked);save();toast("Automatik gespeichert")}
function addRule(){const r=newRule.value.trim();if(!r)return;D.settings.customRules=D.settings.customRules||[];D.settings.customRules.push(r);save();settings()}
function delRule(i){D.settings.customRules.splice(i,1);save();settings()}
function toggleTests(){D.settings.classTestsEnabled=!D.settings.classTestsEnabled;save();settings()}
function exportData(){const blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lyra-lernstand.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetData(){if(confirm("Wirklich deinen gesamten lokalen LYRA-Lernstand löschen?")){localStorage.removeItem(STORAGE_KEY);location.reload()}}

save();
dashboard();
</script>
</body>
</html>
