<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061018"><title>LYRA — Lernassistent</title>
<style>
:root{--bg:#050b11;--p:#0a1721;--line:#214455;--text:#e9f8ff;--muted:#88a5b4;--cyan:#5fe6ff;--green:#62f0b0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#103247 0,transparent 30%),#050b11;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{padding:20px 14px;border-right:1px solid var(--line);background:#061018;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;padding:8px}.orb{width:34px;height:34px;border:1px solid var(--cyan);border-radius:50%;box-shadow:0 0 20px #36c7ef;position:relative}.orb:after{content:"";position:absolute;inset:9px;background:var(--cyan);border-radius:50%;box-shadow:0 0 14px var(--cyan)}.brand{font-weight:900;letter-spacing:.18em}.sub{font-size:9px;color:var(--muted);letter-spacing:.16em}
nav{margin-top:25px;display:grid;gap:7px}nav button{background:transparent;color:var(--muted);border:1px solid transparent;border-radius:10px;padding:12px;text-align:left;font-size:14px}nav button:hover,nav button.active{color:var(--text);border-color:var(--line);background:#0b202c}nav .lock{opacity:.55}
.status{position:absolute;bottom:20px;left:16px;right:16px;padding:11px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 10px var(--green);margin-right:7px}
main{padding:30px;max-width:1200px;width:100%;margin:auto}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.18em}.title{font-size:42px;margin:7px 0}.desc{color:var(--muted);max-width:760px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:25px}.card{grid-column:span 4;padding:18px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#0b1d29,#071118);box-shadow:0 0 28px #06202b}.wide{grid-column:span 8}.full{grid-column:1/-1}.metric{font-size:32px;font-weight:800;margin:10px 0}.bar{height:6px;background:#0b2029;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#1aa9d5,var(--cyan));border-radius:8px}.mode{display:block;width:100%;padding:13px;margin:7px 0;text-align:left;color:var(--text);background:#07151e;border:1px solid var(--line);border-radius:10px}.mode:hover{border-color:var(--cyan)}.muted{color:var(--muted);font-size:13px}.btn{border:1px solid #357a94;background:#0b2734;color:var(--text);padding:10px 14px;border-radius:9px}.btn:hover{border-color:var(--cyan)}input{flex:1;background:#06131b;color:var(--text);border:1px solid var(--line);padding:12px;border-radius:9px}.row{display:flex;gap:8px}.task{padding:11px 0;border-bottom:1px solid #17303b}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--line);border-radius:99px;color:var(--cyan);font-size:10px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{height:auto;position:sticky;z-index:5;border-right:0;border-bottom:1px solid var(--line);padding:8px}.status{display:none}nav{display:flex;overflow:auto;margin:8px 0}nav button{white-space:nowrap;padding:9px}main{padding:18px}.card,.wide{grid-column:1/-1}.title{font-size:32px}}
</style></head>
<body><div class="app"><aside>
<div class="logo"><div class="orb"></div><div><div class="brand">LYRA</div><div class="sub">LEARNING AI</div></div></div>
<nav>
<button class="active" onclick="show('dashboard',this)">⌂ Dashboard</button>
<button onclick="show('learn',this)">◈ Lernen</button>
<button onclick="show('normal',this)">◉ Normal</button>
<button onclick="show('vocab',this)">Aa Vokabeln</button>
<button onclick="show('homework',this)">✓ Hausaufgaben</button>
<button class="lock" onclick="show('tests',this)">▣ Klassenarbeiten 🔒</button>
</nav><div class="status"><span class="dot"></span>System bereit<br>Fortschritt lokal gespeichert</div>
</aside><main id="main"></main></div>
<script>
const curriculum={Mathematik:["Lineare Funktionen","Quadratische Funktionen","Parabeln","Scheitelpunkt","Nullstellen","Quadratische Gleichungen","Potenzfunktionen","Exponentialfunktionen","Wachstums- und Zerfallsprozesse","Gleichungssysteme","Satz des Pythagoras","Trigonometrie","Sinus, Cosinus, Tangens","Winkelberechnungen","Flächen","Volumen","Körper","Ähnlichkeit","Wahrscheinlichkeiten","Baumdiagramme","Vierfeldertafeln","Mittelwert","Median","Streuung","Diagramme","statistische Auswertungen"],Deutsch:["Sachtexte","Argumentationen","Zeitungsartikel","literarische Texte","Kurzgeschichten","Romane","Aufbau","Erzählperspektive","Figuren","Sprache","Stilmittel","Wirkung von sprachlichen Mitteln","Textstellen belegen","Erörterung","Argumentation","Analyse","Stellungnahme","Inhaltsangabe","Textvergleich","Grammatik","Rechtschreibung","Zeichensetzung","Satzbau","Wortarten","direkte/indirekte Rede"],Englisch:["Present / Past / Future","Present Perfect","Past Perfect","Passive","Reported Speech","If-clauses","Relative clauses","Modal verbs","Gerund/infinitive","Comparison","Alltag","Schule","Arbeit/Beruf","Reisen","Umwelt","Gesellschaft","Medien","Zukunft","Großbritannien/Irland","Reading comprehension","Listening","Writing","Mediation","Speaking","Bildbeschreibung","Diskussion","Meinung begründen"],Physik:["Bewegung","Geschwindigkeit","Beschleunigung","Kraft","Arbeit","Leistung","Energie","Energieerhaltung","Elektrizität","Spannung","Stromstärke","Widerstand","Ohmsches Gesetz","elektrische Leistung","Schaltungen","Magnetismus","elektromagnetische Zusammenhänge","eventuell Atom-/Kernphysik"],Chemie:["Atombau","Periodensystem","Ionen","chemische Bindungen","chemische Reaktionen","Reaktionsgleichungen","Säuren","Basen","pH-Wert","Neutralisation","Redoxreaktionen","Oxidation","Reduktion","organische Chemie","Kohlenwasserstoffe","Alkohole","Kunststoffe","Umwelt/Chemie im Alltag"]};
const schedule={Montag:"Englisch",Dienstag:"Trading & Online-Business",Mittwoch:"Deutsch",Donnerstag:"Englisch",Freitag:"Chemie",Samstag:"—",Sonntag:"—"};
let s=JSON.parse(localStorage.getItem("lyra")||'{"done":{}}');
function save(){localStorage.setItem("lyra",JSON.stringify(s))} function next(sub){return (curriculum[sub]||[]).find(x=>!(s.done[sub]||[]).includes(x))||"Alles abgeschlossen"} function pct(sub){let a=curriculum[sub]||[],d=(s.done[sub]||[]).length;return a.length?Math.round(d/a.length*100):0}
function show(v,el){document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));if(el)el.classList.add("active");({dashboard,learn,normal,vocab,homework,tests}[v]||dashboard)()}
function base(title,desc,body){main.innerHTML='<div class="eyebrow">LYRA // LEARNING SYSTEM</div><h1 class="title">'+title+'</h1><div class="desc">'+desc+'</div>'+body}
function dashboard(){let day=new Intl.DateTimeFormat("de-DE",{weekday:"long"}).format(new Date()),sub=schedule[day];base("Willkommen zurück.","Dein Lernsystem kennt deinen festen Stoffplan und führt dich in der vorgesehenen Reihenfolge durch die Themen.",'<div class="grid"><div class="card wide"><div class="eyebrow">HEUTE</div><div class="metric">'+sub+'</div><div class="muted">'+(curriculum[sub]?next(sub):"Kein reguläres Fach eingeplant.")+'</div><div class="bar"><div class="fill" style="width:'+(curriculum[sub]?pct(sub):0)+'%"></div></div><button class="btn" onclick="show('learn')">Lerneinheit starten →</button></div><div class="card"><h3>Modi</h3><button class="mode" onclick="show('learn')">◈ <b>Lernen</b><br><span class="muted">geführt & Schritt für Schritt</span></button><button class="mode" onclick="show('normal')">◉ <b>Normal</b><br><span class="muted">freier KI-Chat</span></button><button class="mode" onclick="show('vocab')">Aa <b>Vokabeln</b><br><span class="muted">Abfragen & Wiederholen</span></button><button class="mode" onclick="show('homework')">✓ <b>Hausaufgaben</b><br><span class="muted">Schritt für Schritt lösen</span></button><button class="mode lock" onclick="show('tests')">▣ <b>Klassenarbeiten</b><br><span class="muted">noch nicht aktiviert</span></button></div><div class="card full"><h3>Feste Lernregeln</h3><p class="muted">Reihenfolge einhalten · Fortschritt pro Fach speichern · erledigte Themen überspringen · bei Fehlern gezielt wiederholen · Schritt für Schritt erklären · nicht sofort die Lösung verraten · am Ende der Einheit Fortschritt festhalten.</p></div></div>')}
function learn(){let day=new Intl.DateTimeFormat("de-DE",{weekday:"long"}).format(new Date()),sub=curriculum[schedule[day]]?schedule[day]:"Deutsch",topic=next(sub);base("Lernen","Geführter Modus: Du arbeitest selbst, ich erkläre und führe dich Schritt für Schritt.",'<div class="card" style="margin-top:25px"><span class="pill">'+sub+'</span><h2>'+topic+'</h2><p class="muted">Starte mit deiner ersten Antwort. In der vollständigen Version wird hier das KI-Modell direkt angebunden und verwaltet deinen Fortschritt.</p><button class="btn" onclick="start(''+sub+'',''+topic.replaceAll("'","&#39;")+'')">Starten</button><div id="lesson"></div></div>')}
function start(sub,t){document.getElementById("lesson").innerHTML='<div class="row" style="margin-top:16px"><input id="ans" placeholder="Deine Antwort …"><button class="btn" onclick="reply()">Senden</button></div>'}
function reply(){let v=document.getElementById("ans").value.trim();if(!v)return;document.getElementById("lesson").innerHTML+='<p class="muted">Deine Antwort wurde aufgenommen. Die echte KI-Analyse wird nach der API-Anbindung aktiv.</p>';document.getElementById("ans").value=""}
function normal(){base("Normal","Freier Chat für Fragen, Erklärungen und Hilfe.",'<div class="card" style="margin-top:25px"><p>KI-Chat bereit. Die API-Anbindung kommt in der nächsten Ausbaustufe.</p><div class="row"><input placeholder="Was möchtest du wissen?"><button class="btn">Senden</button></div></div>')}
function vocab(){base("Vokabeln","Vokabeltraining mit persönlicher Fehlerliste und späterem Spaced-Repetition-System.",'<div class="card" style="margin-top:25px"><h3>Vokabeln</h3><p class="muted">Dieser Bereich ist vorbereitet. Wörter und Wiederholungsintervalle werden in der nächsten Version gespeichert.</p></div>')}
function homework(){base("Hausaufgaben","Aufgaben verwalten und mit dir Schritt für Schritt lösen.",'<div class="card" style="margin-top:25px"><h3>Neue Aufgabe</h3><div class="row"><input id="hw" placeholder="z. B. Mathe Nr. 3d"><button class="btn" onclick="add()">Hinzufügen</button></div><div id="list"></div></div>');draw()}
function add(){let v=hw.value.trim();if(!v)return;(s.tasks??=[]).push({t:v,d:false});save();draw();hw.value=""} function draw(){if(!s.tasks)return;list.innerHTML=s.tasks.map((x,i)=>'<div class="task">□ '+x.t+'</div>').join("")}
function tests(){base("Klassenarbeiten","Der Bereich ist sichtbar, aber entsprechend deiner bisherigen Einstellung noch nicht aktiviert.",'<div class="card" style="margin-top:25px"><h2>🔒 Noch nicht aktiviert</h2><p class="muted">Der Modus bleibt vorbereitet und wird erst später freigeschaltet.</p></div>')}
dashboard();
</script></body></html>
